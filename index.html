<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>CCBJI Copilot プロンプトパック</title>
<style>
:root{--side:#ffffff;--bg:#f1efed;--bar:#ffffff;--surface:#ffffff;--inset:#f6f4f2;--ink:#1c1b1a;--muted:#5f5b58;--line:#dedad6;--accent:#d91e2a;--accent-ink:#ffffff;--track:#d5d0cc;--active:#f3eeeb;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark){:root{--side:#232222;--bg:#3b3a39;--bar:#2b2a2a;--surface:#2b2a2a;--inset:#343332;--ink:#f1efed;--muted:#aaa6a2;--line:#444241;--accent:#f0474f;--accent-ink:#ffffff;--track:#5a5857;--active:#353433;--shadow:0 2px 10px rgba(0,0,0,.25)}}
:root[data-theme="light"]{--side:#ffffff;--bg:#f1efed;--bar:#ffffff;--surface:#ffffff;--inset:#f6f4f2;--ink:#1c1b1a;--muted:#5f5b58;--line:#dedad6;--accent:#d91e2a;--accent-ink:#ffffff;--track:#d5d0cc;--active:#f3eeeb;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06)}
:root[data-theme="dark"]{--side:#232222;--bg:#3b3a39;--bar:#2b2a2a;--surface:#2b2a2a;--inset:#343332;--ink:#f1efed;--muted:#aaa6a2;--line:#444241;--accent:#f0474f;--accent-ink:#ffffff;--track:#5a5857;--active:#353433;--shadow:0 2px 10px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,system-ui,sans-serif;font-size:16px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.caps{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.app{display:grid;grid-template-columns:340px minmax(0,1fr);height:100vh}
.side{background:var(--side);display:flex;flex-direction:column;min-height:0;border-inline-end:1px solid var(--line)}
.sidehead{display:flex;gap:16px;align-items:center;padding:26px 24px 24px;border-block-end:1px solid var(--line)}
.logo{inline-size:84px;flex:none;display:block}
.logo svg{display:block;inline-size:100%;block-size:auto}
.logo span{display:block;text-align:center;font-size:8px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-block-start:3px;white-space:nowrap}
.sidehead .caps{color:var(--muted)}
.brand{font-size:19px;font-weight:600;line-height:1.3;margin-block-start:2px}
.choose{padding:22px 24px 8px;color:var(--muted)}
.nav{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:4px}
.nav button{display:grid;grid-template-columns:30px 1fr;column-gap:12px;align-items:start;text-align:start;background:none;border:1px solid transparent;border-radius:12px;padding:12px 12px 13px}
.nav button:hover{background:var(--active)}
.nav button[aria-current="true"]{background:var(--active);border-color:var(--line)}
.num{inline-size:30px;block-size:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.nt{font-size:15px;font-weight:700;line-height:1.4;padding-block-start:2px}
.ns{font-size:12.5px;color:var(--muted);line-height:1.4;margin-block-start:6px}
.sidefoot{padding:14px 24px;border-block-start:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
.dot{inline-size:7px;block-size:7px;border-radius:50%;background:var(--accent);flex:none}
.right{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{background:var(--bar);border-block-end:1px solid var(--line);padding:14px 40px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar h1{font-size:15px;margin:0;line-height:1.4}
.bar p{margin:0;color:var(--muted);font-size:12.5px}
.barright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.track{inline-size:110px;block-size:5px;border-radius:99px;background:var(--track);overflow:hidden}
.fill{block-size:100%;background:var(--accent);border-radius:99px;transition:inline-size .25s}
.tool{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.tool:hover{border-color:var(--accent);color:var(--ink)}
.scroll{flex:1;min-height:0;overflow-y:auto}
.main{padding:44px 40px 56px;max-inline-size:1000px}
section.ex{display:none}
section.ex.active{display:block}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:32px;align-items:start}
.kick{display:flex;align-items:center;gap:10px;color:var(--accent)}
.kick::before{content:"";inline-size:28px;block-size:3px;background:var(--accent);border-radius:2px}
.hero h2{font-size:clamp(28px,3.6vw,42px);line-height:1.25;margin:12px 0 16px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted);font-size:17px;line-height:1.75}
.skill{background:var(--surface);border:1px solid var(--line);border-block-start:3px solid var(--accent);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.skill .caps{color:var(--muted);font-size:11px}
.skill .v{font-weight:700;font-size:16px;margin:8px 0 10px;line-height:1.4}
.skill .f{font-size:13.5px;color:var(--muted);line-height:1.6}
.notes{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.notes li{font-size:14px;padding:11px 16px;border-inline-start:3px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0;color:var(--muted)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:38px 0 14px}
.sechead h3{font-size:17px;margin:0}
.sechead span{font-size:13px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-block-start:34px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.card .n{inline-size:30px;block-size:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.card h4{margin:14px 0 8px;font-size:17px;line-height:1.4}
.card p{margin:0;font-size:14.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:var(--shadow);margin-block-start:28px}
.panel .caps{color:var(--accent)}
.panel h3{font-size:24px;line-height:1.35;margin:8px 0 10px}
.panel>p{margin:0;color:var(--muted);font-size:15.5px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px;margin-block-start:30px}
.step .c{display:flex;align-items:center;gap:0}
.step .c b{inline-size:36px;block-size:36px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:12px;flex:none}
.step .c i{flex:1;block-size:2px;background:var(--track);margin-inline-start:8px}
.step h4{margin:16px 0 6px;font-size:16px;line-height:1.4}
.step p{margin:0;font-size:14px;color:var(--muted)}
.ings{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-block-start:26px}
.ing{background:var(--inset);border-radius:12px;padding:18px}
.ing h4{margin:0 0 6px;font-size:16px;color:var(--accent)}
.ing .q{font-size:14.5px;font-weight:700;margin-block-end:6px}
.ing p{margin:0;font-size:14px;color:var(--muted)}
.vid{display:block;inline-size:100%;max-block-size:70vh;background:#000;border-radius:12px;margin-block-start:22px}.vfall{margin-block-start:22px!important;padding:16px 18px;border:1px dashed var(--line);border-radius:12px;background:var(--inset)}.dl{margin-block-start:22px;font-size:14px;padding:11px 18px}.fname{margin-block-start:10px;font-size:12.5px;color:var(--muted)}
.appicon{display:block;inline-size:44px;block-size:44px;object-fit:contain;margin-block-end:12px}
.remember{margin-block-start:20px;padding:14px 18px;border-radius:12px;background:var(--inset);font-size:14.5px;border-inline-start:3px solid var(--accent)}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-block-end:18px;overflow:hidden}
.ph{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding:20px 22px 18px;border-block-end:1px solid var(--line)}
.pid{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.04em}
.pt{font-weight:700;font-size:17px;line-height:1.45;margin-block-start:2px}
.pa{font-size:13px;color:var(--muted);margin-block-start:4px}
.copy{background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:8px 18px;font-size:13px;font-weight:700;flex:none;white-space:nowrap}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.view{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--inset);border:1px dashed var(--line);border-radius:12px;padding:7px 12px;flex:none;max-inline-size:280px;line-height:1.4;text-align:center}
.pb{padding:20px 22px 22px}
.ptext{margin:0;white-space:pre-wrap;font-size:16px;line-height:1.85}
.how{margin:18px 0 0;font-size:13.5px;color:var(--muted);background:var(--inset);border-radius:10px;padding:11px 16px}
.how a.lnk{color:var(--accent);font-weight:600;text-decoration:underline;white-space:nowrap}
.how b{color:var(--accent);margin-inline-end:10px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-block-start:30px}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 20px;font-size:14px;font-weight:700}
.pg:hover{border-color:var(--accent)}
.pg[disabled]{opacity:.35;cursor:default}
.pg.nextb{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
footer{margin-block-start:40px;padding-block-start:16px;border-block-start:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer p{margin:0 0 4px}
.toast{position:fixed;inset-block-end:24px;inset-inline:0;margin-inline:auto;inline-size:max-content;max-inline-size:90vw;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:1100px){.app{grid-template-columns:270px minmax(0,1fr)}.sidehead{padding:20px 16px;gap:12px}.logo{inline-size:64px}.brand{font-size:16px}.choose{padding-inline:16px}.nav{padding-inline:8px}.sidefoot{padding-inline:16px}.bar{padding-inline:24px}.main{padding:32px 24px 48px}.hero{grid-template-columns:1fr}}
@media (max-width:640px){.app{grid-template-columns:1fr;height:auto}.side{border-inline-end:none;border-block-end:1px solid var(--line)}.nav{max-block-size:230px}.scroll{overflow:visible}.right{min-height:auto}}
@media print{.side,.barright,.pager,.copy,.toast{display:none}.app{display:block;height:auto}.scroll{overflow:visible}section.ex{display:block;break-before:page}section.ex:first-of-type{break-before:auto}.card,.prompt,.panel,.skill{box-shadow:none;break-inside:avoid}.main{padding:16px 0;max-inline-size:none}}
</style>
</head>

n should Copilot use?"}, "d": {"ja": "対象の文書、ブック、メール、会議、またはWebを指定します。", "en": "Point to the document, workbook, email thread, meeting or the web."}}, {"t": {"ja": "期待する形式", "en": "Expectations"}, "q": {"ja": "どのように答えてほしいですか。", "en": "How should Copilot respond?"}, "d": {"ja": "形式、詳しさ、トーン、根拠の示し方を指定します。", "en": "Define the format, level of detail, tone and evidence you expect."}}], "remember": {"ja": "プロンプトは対話です。最初の回答を確認し、前提を問い直し、足りない情報を補って、改善を依頼してください。", "en": "Prompting is a conversation. Review the first answer, question its assumptions, add what is missing, and ask Copilot to improve it."}, "prompts": []}, {"id": "workiq", "kind": "try", "nav": {"ja": "ビジネスを理解するCopilot", "en": "Copilot understands your business"}, "navSub": {"ja": "Work IQ", "en": "Work IQ"}, "title": {"ja": "ビジネスを理解するCopilot", "en": "Copilot understands your business"}, "desc": {"ja": "Copilotは、ご自身のメール、会議、チャット、ファイルに加えて、組織全体で共有されている資料、会議、やり取り、人のつながりも踏まえて、出典を示しながら回答します。参照するのは、ご自身にアクセス権のある情報だけです。この力をWork IQと呼びます。まず、Copilotがご自身の仕事と組織をどこまで理解しているかを確かめてみましょう。", "en": "Copilot answers from your own work (your email, meetings, chats and files) and from your organization's shared knowledge: its documents, meetings, conversations and the way people work together. It uses only what you already have permission to see, and it always shows its sources. This ability is called Work IQ. Start by seeing how well Copilot already understands your work and your organization."}, "skill": {"ja": "Work IQを体感する", "en": "Experiencing Work IQ"}, "features": {"ja": "個人と組織の両方の文脈、アクセス権の尊重、出典の表示", "en": "Personal and organizational context; your permissions respected; sources cited"}, "notes": [{"ja": "Copilotが参照するのは、ご自身にアクセス権のある情報だけです。回答は、ご自身にしか表示されません。", "en": "Copilot uses only information you already have permission to access, and only you can see your answers."}, {"ja": "まず講師のデモをご覧いただき、そのあとご自身のCopilotでお試しください。", "en": "Watch the demonstration first, then try it in your own Copilot."}, {"ja": "A1からA4は、同じ会話の中で続けて実行してください。", "en": "Run A1 to A4 in one conversation."}], "prompts": [{"id": "A1", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "私の仕事について知っていること", "en": "What Copilot knows about my work"}, "text": {"ja": "私の仕事について、あなたが理解していることを教えてください。私の役割、現在の優先事項、よく一緒に仕事をする相手、この1か月の時間の使い方をまとめてください。", "en": "What do you know about my work? Summarize my role, my current priorities, the people I work with most, and where my time has gone over the past month."}, "how": {"ja": "出典のリンクを開くと、それぞれの根拠を確認できます。", "en": "Open the source links to see what each point is based on."}}, {"id": "A2", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "私の仕事の進め方", "en": "My working style"}, "text": {"ja": "私の仕事の進め方とコミュニケーションの特徴を、最近の具体例とともに説明してください。うまくいっている点と、周囲が難しいと感じるかもしれない点の両方を挙げてください。", "en": "Describe how I work and communicate, with specific recent examples. Include what works well and what others may find difficult."}, "how": {"ja": "同じ会話の中で続けます。", "en": "Continue in the same conversation."}}, {"id": "A3", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "私の見落とし", "en": "My blind spots"}, "text": {"ja": "私が見落としているかもしれないことは何ですか。率直に指摘してください。十分に時間を割けていないテーマや相手、フォローできていない約束、見直すべき習慣を挙げ、それぞれ出典を示してください。", "en": "What might I be missing? Be candid. Point out the topics or people I give too little time, the commitments I have not followed up, and the habits I should change. Cite the source for each point."}, "how": {"ja": "気になった点は、「もう少し詳しく」「来週から何を変えるべきか」と続けて尋ねてください。", "en": "Follow up on any point: \"Tell me more\" or \"What should I change next week?\""}}, {"id": "A4", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "私の組織で起きていること", "en": "What is happening across my organization"}, "text": {"ja": "私がアクセスできる情報をもとに、私の組織全体で今起きていることを教えてください。各チームが最も時間を割いているテーマ、チーム間で見解が分かれている点、決定が止まっている案件を挙げ、それぞれ出典を示してください。", "en": "Based on what I have access to, what is happening across my organization right now? Show the themes my teams are spending most time on, where teams see things differently, and which decisions are stalled. Cite the source for each point."}, "how": {"ja": "ご自身の仕事から、組織全体へと視野を広げます。回答の範囲は、ご自身のアクセス権によって決まります。", "en": "This widens the view from your own work to your organization. What Copilot can draw on depends on your permissions."}}]}, {"id": "week", "kind": "try", "nav": {"ja": "今週の優先順位をつける", "en": "Prioritize your week"}, "navSub": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "今週の優先順位をつける", "en": "Prioritize your week"}, "desc": {"ja": "月曜日の朝。受信トレイはいっぱいで、Teamsではいくつもの議論が進んでいます。メールを開く前に、まずCopilotに、どこに注意を向けるべきかを尋ねます。", "en": "It is Monday morning. Your inbox is full and several discussions are under way in Teams. Before you open a single email, ask Copilot where your attention is needed."}, "skill": {"ja": "優先順位をつけ、準備し、伝える", "en": "Prioritizing, preparing and communicating"}, "features": {"ja": "ご自身の業務データにもとづく回答、追加の質問による掘り下げ、会議の準備とフォローアップ、二言語での作成", "en": "Answers from your own work data; follow-up questions; meeting preparation and follow-up; writing in two languages"}, "notes": [{"ja": "まず講師のデモをご覧いただき、そのあとご自身のCopilotでお試しください。", "en": "Watch the demonstration first, then try it in your own Copilot."}, {"ja": "[ ] の部分は、ご自身の内容に置き換えてください。", "en": "Replace the text in [ ] with your own details."}, {"ja": "時間が限られる場合は、B1、B2、B4を優先してください。", "en": "If time is short, do B1, B2 and B4 first."}], "prompts": [{"id": "B1", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "今週、私の対応が必要なこと", "en": "What needs my attention this week"}, "text": {"ja": "今週、私の判断や対応が必要なことは何ですか。「要判断」「リスク」「参考情報」に分類して、誰が私の回答を待っているかを示してください。", "en": "What needs my decision or attention this week? Group the items as \"decision needed\", \"risk\" or \"for information\", and show who is waiting for my answer."}, "how": {"ja": "出典のリンクから、元のメールやチャットを開けます。回答が物足りない場合は、「メールと会議も確認してください」と続けてください。", "en": "Use the source links to open the original email or chat. If the answer seems thin, follow up with \"Check my email and meetings too.\""}}, {"id": "B2", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "一段深く掘り下げる", "en": "Go one level deeper"}, "text": {"ja": "最も重要な3件について、背景、最新の状況、進展を妨げている要因、推奨する次の一手を示してください。表形式でまとめてください。", "en": "For the three most important items, show the background, the latest development, what is holding it up, and your recommended next step. Present this as a table."}, "how": {"ja": "B1と同じ会話で続けて実行します。最初からやり直さずに、追加の質問で内容を深められます。", "en": "Run it in the same conversation as B1. Each follow-up adds detail without starting over."}}, {"id": "B3", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "前回の会議を振り返る", "en": "Recap my last leadership meeting"}, "text": {"ja": "前回のリーダーシップ会議の主な決定事項と未完了のアクションを、担当者とあわせてまとめてください。", "en": "Summarize the key decisions and open actions from my last leadership meeting, with an owner for each action."}, "how": {"ja": "会議名を指定すると、より正確な回答になります。", "en": "Name the meeting for a more precise answer."}}, {"id": "B4", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "重要な面談に備える", "en": "Prepare for an important meeting"}, "text": {"ja": "[相手または会議名]との次回の面談に向けて準備をしたいです。これまでの経緯、先方の要望、当社の現在の立場、私が伝えるべき3つのポイントを、1ページにまとめてください。", "en": "Help me prepare for my next meeting with [person or meeting name]. On one page, summarize the background, what they are asking for, our current position, and three points I should make."}, "how": {"ja": "お客様とのトップ面談や、重要な社内会議の準備に適しています。", "en": "Works well for a top-to-top customer meeting or an important internal review."}}, {"id": "B5", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "会議後のフォローアップ", "en": "Follow up after a meeting"}, "text": {"ja": "[相手または会議名]との直近の会議について、フォローアップのメールを下書きしてください。決定事項を確認し、各アクションの担当者と期限を一覧にし、未解決の論点を記載してください。簡潔で丁寧なビジネス文にしてください。", "en": "Draft a follow-up email for my last meeting with [person or meeting name]. Confirm the decisions made, list each action with its owner and due date, and note any open questions. Keep it brief and professional."}, "how": {"ja": "Copilotが作成するのは下書きのみです。内容を確認・修正したうえで、ご自身で送信してください。", "en": "Copilot prepares a draft only. Review and edit it before you send it yourself."}}, {"id": "B6", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "二つの言語で伝える", "en": "Communicate in two languages"}, "text": {"ja": "[テーマ]の現状を、英語で5項目の箇条書きにまとめてください。続けて、同じ内容をリーダーシップチーム向けに、自然なビジネス日本語で作成してください。", "en": "Summarize the current status of [topic] in five bullet points in English. Then write the same summary in natural business Japanese for the leadership team."}, "how": {"ja": "トーンや長さは、続けて指示すれば調整できます。自動で送信されることはありません。", "en": "Ask a follow-up to adjust tone or length. Nothing is sent on your behalf."}}]}, {"id": "plan", "kind": "try", "nav": {"ja": "計画から意思決定へ", "en": "From plan to decision"}, "navSub": {"ja": "リサーチツール、Word、Excel、PowerPoint", "en": "Researcher, Word, Excel, PowerPoint"}, "title": {"ja": "計画から意思決定へ", "en": "From plan to decision"}, "desc": {"ja": "計画が提出され、その数値に疑問が出ています。判断の前にリーダーが必要とするのは、外部の視点、計画の弱点の把握、そして選択肢を整理した短い資料の3つです。リーダーはモデルを作るのではなく、問いを立てます。", "en": "A plan is on the table and its numbers are being questioned. Before the decision, a leader needs three things: an outside view, a clear picture of where the plan is fragile, and a short paper that frames the choice. You do not build the model; you question it."}, "skill": {"ja": "計画を検証し、意思決定につなげる", "en": "Testing a plan and framing the decision"}, "features": {"ja": "リサーチツール、Copilot Chat、Copilot in Word、Copilot in Excel、Copilot in PowerPoint、ワークスペース", "en": "Researcher, Copilot Chat, Copilot in Word, Copilot in Excel, Copilot in PowerPoint, Workspaces"}, "notes": [{"ja": "まず各ステップのデモをご覧いただき、そのあと同じ順番でお試しください。", "en": "Watch each step demonstrated first, then try the steps in the same order."}, {"ja": "C3ではサンプルの事前資料を、C4からC7ではサンプルの計画ブックを使用します。どちらも下のボタンからダウンロードできます。データはすべて架空です。", "en": "C3 uses the sample pre-read, and C4 to C7 use the sample plan workbook. You can download both be nsscvH/f0oWffrrY8oheGwvxqnED99VcQyI7c6VZkfawT/2S52/7BgX/zxr8ZxS7hLJdSOOcMAADa3kg8MvjTEzvPfVwCvsnAb0hT+yqQM5zpB0EcgNtIcoJVfsdt9ENJ4/2oooDcZj+WO302O6/1jtf8tz/8zEe2rrqq69V4iCmw98b/9f8BJU4j5L8npmkAAAAASUVORK5CYII="}], "prompts": [{"id": "C1", "title": {"ja": "外部の視点を得る", "en": "Get the outside view"}, "text": {"ja": "2027年の日本の清涼飲料市場の見通し、自動販売機チャネルの動向、主要飲料メーカーの値上げへの対応について、公開情報とアナリストの見解を調査してください。事実と意見を区別し、すべての出典を示してください。", "en": "Research what public sources and analysts say about the outlook for Japan's soft-drink market in 2027, trends in the vending channel, and how major beverage companies are responding to price increases. Separate fact from opinion and cite every source."}, "how": {"ja": "調査には数分かかり、結果はレポートとして表示されます。", "en": "Research takes a few minutes and is returned as a report."}, "app": {"ja": "リサーチツール", "en": "Researcher"}}, {"id": "C2", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "公開されている報告書を読み解く", "en": "Analyze a published report"}, "text": {"ja": "添付の統合報告書をもとに、単なる要約ではなく、経営の視点でストーリーを説明してください。会社が掲げる優先課題と目標、報告されている進捗、強調されているリスクは何ですか。最後に、来年度の計画がこれらの優先課題をどう支えるかについて、リーダーが問うべき質問を5つ挙げてください。", "en": "Using the attached integrated report, give me the executive story, not just a summary. What are the company's stated priorities and targets, what progress does it report, and which risks does it highlight? End with five questions a leader should ask about how next year's plan supports these priorities."}, "how": {"ja": "コカ・コーラ ボトラーズジャパンホールディングスのIRサイトから最新の統合報告書（PDF）をダウンロードし、Copilot Chatに添付します。このステップでは、サンプルデータではなく、実際の公開資料を使います。", "en": "Download the latest integrated report (PDF) from the Coca-Cola Bottlers Japan Holdings investor site and attach it in Copilot Chat. This step uses a real public document, not sample data."}, "link": {"url": "https://en.ccbj-holdings.com/ir/library/annual.php", "label": {"ja": "統合報告書のページを開く（英語サイト）", "en": "Open the integrated report page"}}}, {"id": "C3", "app": {"ja": "Copilot in Word", "en": "Copilot in Word"}, "title": {"ja": "計画の事前資料を確認する", "en": "Review the plan pre-read"}, "text": {"ja": "この計画について判断する会議があります。経営の視点で説明してください。何が提案されているのか、計画は何に依存しているのか、私に求められている判断は何か。そのうえで、最も根拠の弱い前提、不足している裏付け、承認の前に私が問うべき3つの質問を挙げてください。", "en": "I have a meeting to decide on this plan. Give me the executive story: what is being proposed, what the plan depends on, and what decision I am being asked to make. Then identify the weakest assumptions, any evidence that is missing, and the three questions I should ask before approving."}, "how": {"ja": "サンプルの事前資料をWordで開き、Copilotを選びます。", "en": "Open the sample pre-read in Word, then select Copilot."}}, {"id": "C4", "title": {"ja": "計画の前提を検証する", "en": "Test the plan's assumptions"}, "text": {"ja": "この計画の前提のうち、事業利益全体へのリスクが最も大きいものはどれですか。事業部の前提に代えて財務部門の価格弾力性を適用した場合、合計がどう変わるかを示してください。", "en": "Which assumptions in this plan put total business profit most at risk? Show how the total changes if we apply Finance's price elasticity instead of the business units' assumption."}, "how": {"ja": "サンプルの計画ブックを開いた状態で、Excel内のCopilotで実行します。", "en": "Run it in Copilot in Excel, with the sample plan workbook open."}, "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}}, {"id": "C5", "title": {"ja": "差をグラフで示す", "en": "Show the gap in a chart"}, "text": {"ja": "事業部の計画と財務部門の見方を、事業部別に比較するグラフを作成してください。差が10億円を超える事業部を強調してください。", "en": "Create a chart comparing the business units' plan with Finance's view, by business unit. Highlight any unit where the gap exceeds ¥1 billion."}, "how": {"ja": "C4のすぐあとに実行します。", "en": "Run it straight after C4."}, "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}}, {"id": "C6", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "目標との差を埋める方法を探る", "en": "Find what closes the gap"}, "text": {"ja": "財務部門の見方が正しいとした場合、目標を達成するには何を変える必要がありますか。事業部別に2～3の選択肢を挙げ、それぞれが事業利益の合計に与える影響を示してください。", "en": "If Finance's view is right, what would have to change to reach the target? Show two or three options by business unit, with the effect of each on total business profit."}, "how": {"ja": "選択肢は議論の出発点としてお使いください。判断に使う前に、計算を確認してください。", "en": "Treat the options as a starting point for discussion, and check the calculations before you rely on them."}}, {"id": "C7", "app": {"ja": "Copilot in PowerPoint", "en": "Copilot in PowerPoint"}, "title": {"ja": "意思決定資料を作成する", "en": "Create the decision paper"}, "text": {"ja": "この計画ブックをもとに、リーダーシップチーム向けの3枚の意思決定サマリーを作成してください。背景ではなく、必要な決定から始めてください。1枚目は目標に対する現状、2枚目は3つの選択肢と利益への影響、3枚目は推奨案と必要な決定事項です。各スライドの要点を発表者ノートに記載してください。", "en": "Using this plan workbook, create a three-slide decision summary for the leadership team. Lead with the decision required, not the background. Slide 1: where we stand against the target. Slide 2: three options and their impact on profit. Slide 3: the recommendation and the decision required. Add speaker notes with the key message for each slide."}, "how": {"ja": "デモでは、ブランドキットで会社の色とフォントを適用する様子もご覧いただきます。", "en": "The demonstration also shows a brand kit applying company colors and fonts."}}, {"id": "C8", "title": {"ja": "未解決の問いを洗い出す", "en": "Identify the open questions"}, "text": {"ja": "このワークスペースの情報をもとに、判断の前に解決すべき問いは何か、それぞれ誰が担当すべきかを示してください。", "en": "Based on everything in this workspace, which questions remain unanswered before the decision, and who should own each one?"}, "how": {"ja": "質問の前に、関連資料をワークスペースに追加しておきます。", "en": "Add the related material to the workspace before you ask."}, "app": {"ja": "ワークスペース", "en": "Workspaces"}}], "samples": [{"name": "CCBJI 2027 Plan - SAMPLE DATA.xlsx", "b64": "UEsDBBQAAAAIAAAAIQAfm12L7wAAAIoBAAAQAAAAZG9jUHJvcHMvYXBwLnhtbJyQTU/DMAyG70j8hyj3NRlIE5rSTONLXCY4jN2j1O0iWjtKwtT+ewwTBXHkZvu1H7+22YxDL06QciCs5bLSUgB6agJ2tXzdPy5upMjFYeN6QqjlBFlu7OWFeUkUIZUAWTACcy2PpcS1UtkfYXC5YhlZaSkNrnCaOkVtGzzck38fAIu60nqlYCyADTSLOAPlmbg+lf9CG/Kf/vJhP0U2bM02xj54V/hKuws+Uaa2iIfRQy+esQ8IRv3uMTuHroNkjZqjOxqiw4lLc/TE+MTTb7cuAwt/ciYezq+1y1Wlr7X+2vJdM+rnifYDAAD//wMAUEsDBBQAAAAIAAAAIQDhdWTSpgEAAD0DAAARAAAAZG9jUHJvcHMvY29yZS54bWyM tle": {"ja": "プロンプトを磨く", "en": "Sharpen your prompts"}, "desc": {"ja": "どの回答もよくする二つの習慣です。プロンプト コーチと一緒にプロンプトを磨くこと、そしてCopilotの回答をそのまま受け入れず、問い直すことです。", "en": "Two habits that improve every answer: refine your prompt with Prompt Coach, and challenge Copilot's answer rather than accepting it as given."}, "skill": {"ja": "プロンプトを磨き、回答を問い直す", "en": "Refining prompts and challenging answers"}, "features": {"ja": "プロンプト コーチ、前提と根拠の確認", "en": "Prompt Coach; checking assumptions and evidence"}, "notes": [{"ja": "[ ] の部分は、ご自身の内容に置き換えてください。", "en": "Replace the text in [ ] with your own details."}], "prompts": [{"id": "D1", "title": {"ja": "プロンプトを改善する", "en": "Improve my prompt"}, "text": {"ja": "次のプロンプトを改善してください：「[2027年計画の状況を教えてください]」。よりよい回答を得るための質問を、3つまで私にしてください。そのうえで、目的、背景、情報源、期待する形式を明確にして書き直してください。", "en": "Help me improve this prompt: \"[Give me an update on our 2027 plan]\". Ask me up to three questions that would lead to a better answer. Then rewrite the prompt with a clear goal, context, source and expectations."}, "how": {"ja": "[ ] の例は、ご自身のプロンプトに置き換えられます。質問に答えたあと、書き直されたプロンプトをCopilot Chatで実行し、元のプロンプトの結果と比べてみてください。", "en": "You can replace the example in [ ] with a prompt of your own. Answer the questions, then run the rewritten prompt in Copilot Chat and compare it with the result of the original."}, "app": {"ja": "プロンプト コーチ", "en": "Prompt Coach"}}, {"id": "D2", "title": {"ja": "回答を問い直す", "en": "Challenge the answer"}, "text": {"ja": "今の回答で、どのような前提を置きましたか。根拠が最も弱いのはどの部分で、どのような情報があれば結論が変わりますか。", "en": "What assumptions did you make in that answer? Which part has the weakest support, and what information would change your conclusion?"}, "how": {"ja": "Copilotの回答は、そのまま受け入れず、問い直すことが大切です。重要な判断に使う前に、どのCopilotのどの回答にも使えます。", "en": "Do not accept an answer as given: challenge it. This works on any answer, in any Copilot, before you rely on it for an important decision."}, "app": {"ja": "Copilot Chat（どのCopilotでも可）", "en": "Copilot Chat (or any Copilot)"}}], "appsEyebrow": {"ja": "は s, and it can also use the browser and other tools. You see its plan and its progress, and nothing is sent until you have reviewed it."}, "skill": {"ja": "タスクを任せ、結果を確認する", "en": "Delegating a task and reviewing the result"}, "features": {"ja": "計画と自己修正、時間のかかる複数ステップのタスク、ブラウザーなどのツール、送信前の確認", "en": "Planning and self-correction; long-running, multi-step tasks; the browser and other tools; review before sending"}, "notes": [{"ja": "Coworkは、現時点では皆さまの環境で有効になっていません。IT部門のガバナンス方針に沿って導入が進められ、利用量に応じた課金となります。", "en": "Cowork is not yet enabled in your environment. It will be introduced in line with your IT team's governance plan, and it is billed by usage."}, {"ja": "以下は、デモでお見せするプロンプトです。参考としてご覧ください。本日は実行できません。", "en": "The prompts below are the ones shown in the demonstration. They are for reference and cannot be run today."}], "prompts": [{"id": "E1", "view": true, "title": {"ja": "この数値は信頼できるか", "en": "Can I trust these numbers?"}, "text": {"ja": "2027年計画を照合する前に、数値が信頼できるかを確認してください。計画ワークブック、販促計画、前年実績、自販機マスターリスト、CFOのメールを比較し、ソース間の不整合を見つけてください。たとえば、一致しない台数、対応しないコード、混在する単位、二重計上された費用、重複した商品、古いデータなどです。各課題について、関係するソースと行を示し、可能な場合は2027年の事業利益への影響を見積もり、重要度を評価し、誰が修正すべきかを示してください。Excelの課題ログと、私向けの半ページの要約を作成してください。ソースデータは一切変更しないでください。", "en": "Before we reconcile the 2027 plan, check whether the numbers can be trusted. Compare the plan workbook, the promotion plan, the prior-year actuals, the machine master list and the CFO's email. Find inconsistencies across them: counts that do not match, codes that do not map, mixed units, double-counted spend, duplicate products and out-of-date data. For each issue, show the sources and rows involved, estimate the effect on 2027 business profit where possible, rate its severity and name who should fix it. Produce an issue log in Excel and a half-page summary for me. Do not change any source data."}, "how": {"ja": "複数のブック、リスト、メールにまたがる不整合を見つけ、業務の言葉で説明します。データの修正と管理は、引き続き担当チームが担います。", "en": "Cowork finds inconsistencies across workbooks, lists and email, and explains them in business terms. Correcting and owning the data remains with your teams."}, "app": {"ja": "Copilot Cowork", "en": "Copilot Cowork"}}, {"id": "E2", "view": true, "title": {"ja": "一度の依頼で、タスク全体を", "en": "One request, the whole task"}, "text": {"ja": "金曜日の2027年計画承認の前に、自販機、小売（OTC）、フードサービスの各計画を利益目標と照合してください。データチェックの課題ログを踏まえ、影響を受ける数値には注記を付けてください。計画ワークブック、販促計画、CFOのメール、事業部リーダーのTeamsでの議論を使用してください。価格弾力性と販促費について3つのシナリオを作成し、Wordの1ページ意思決定ブリーフ、Excelのシナリオワークブック、CCBJI Demoブランドキットを使った3枚のスライドを作成してください。各事業部の責任者への質問を1つずつ下書きしてください。何も送信せず、確認用の下書きを見せてください。", "en": "Before Friday's 2027 plan sign-off, reconcile the Vending, Retail/OTC and Food Service plans against the profit target. Start from the issue log from the data check and flag any figure it affects. Use the plan workbook, the promotion plan, the CFO's email and the business unit leads' Teams discussion. Run three scenarios for price elasticity and promotion spend. Produce a one-page decision brief in Word, a scenario workbook in Excel and a three-slide deck using the CCBJI Demo brand kit. Draft one question for each business unit president. Do not send anything; show me the drafts for review."}, "how": {"ja": "Coworkが選択肢を用意し、価格、販促、お客様に関する判断はリーダーシップチームが行います。", "en": "Cowork prepares the options. The leadership team decides on price, promotion and customers."}, "app": {"ja": "Copilot Cowork", "en": "Copilot Cowork"}}, {"id": "E3", "view": true, "title": {"ja": "自分専用のダッシュボードを作る", "en": "Build my own dashboard"}, "text": {"ja": "先ほど作成したシナリオワークブックを使って、リーダーシップチーム向けのインタラクティブな1ページのダッシュボードを作成してください。2027年の事業利益合計を目標レンジと比較して表示し、価格弾力性と販促費のスライダーで合計が更新されるようにしてください。事業部別・チャネル別の利益と、3つのシナリオの比較も並べて表示してください。CCBJI Demoブランドキットの色を使い、「架空のデモデータ」と明記し、ラベルは英語と日本語で表示してください。まだ共有はしないでください。", "en": "Using the scenario workbook you just created, build me an interactive one-page dashboard for the leadership team. Show total 2027 business profit against the target range, sliders for price elasticity and promotion spend that update the total, profit by business unit and channel, and the three scenarios side by side. Use the CCBJI Demo brand kit colors, label it \"Fictional demo data\", and show labels in English and Japanese. Do not share it yet."}, "how": {"ja": "見たい画面を言葉で伝えるだけで、前提を動かして確かめられるページができます。公式の数値は、引き続きBIチームが管理します。", "en": "Describe the view you want, and receive a page that responds as you change an assumption. The official figures remain with your BI team."}, "app": {"ja": "Copilot Cowork", "en": "Copilot Cowork"}}]}, {"id": "yours", "kind": "optional", "nav": {"ja": "自分用に整える", "en": "Make it yours"}, "navSub": {"ja": "パーソナライズ", "en": "Personalization"}, "title": {"ja": "自分用に整える", "en": "Make it yours"}, "desc": {"ja": "ご自身の役割と、好みの回答スタイルをCopilotに伝えます。毎回同じ説明を繰り返す必要がなくなります。", "en": "Tell Copilot your role and how you like your answers, so that you do not need to repeat it each time."}, "skill": {"ja": "Copilotのパーソナライズ", "en": "Personalizing Copilot"}, "features": {"ja": "回答スタイルの指定、繰り返し使えるプロンプト", "en": "Setting a response style; reusable prompts"}, "notes": [{"ja": "[ ] の部分は、ご自身の内容に置き換えてください。", "en": "Replace the text in [ ] with your own details."}], "prompts": [{"id": "F1", "title": {"ja": "回答スタイルを設定する", "en": "Set my response style"}, "text": {"ja": "私は[役職]で、[担当領域]を担当しています。今後は、結論を最初に述べ、要点は5項目以内の箇条書きとし、出典を示し、不確かな点は明記してください。私が英語で書いた場合を除き、日本語で回答してください。", "en": "I am [role], responsible for [area]. From now on: lead with the conclusion, keep the key points to five bullets or fewer, cite your sources, and flag anything uncertain. Reply in Japanese unless I write in English."}, "how": {"ja": "会話の最初に貼り付けるか、Copilotのパーソナライズ設定に保存します。", "en": "Paste it at the start of a conversation, or save it in Copilot's personalization settings."}, "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}}, {"id": "F2", "title": {"ja": "繰り返し使えるプロンプトを見つける", "en": "Find prompts worth repeating"}, "text": {"ja": "この2週間の私の仕事をもとに、あなたが毎週手伝える定例の作業を3つ挙げ、それぞれについて繰り返し使えるプロンプトを提案してください。", "en": "Looking at my work over the last two weeks, identify three recurring tasks you could help me with each week, and suggest a reusable prompt for each."}, "how": {"ja": "役に立つプロンプトは保存しておくと、次回すぐに使えます。", "en": "Save the prompts you find useful so they are ready next time."}, "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}}]}]}</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var EX=D.exercises,UI=D.ui,M=D.meta,N=EX.length-1;
  function get(k,d){try{var v=localStorage.getItem('ccbji-pp-'+k);return v===null?d:v}catch(e){return d}}
  function set(k,v){try{localStorage.setItem('ccbji-pp-'+k,v)}catch(e){}}
  var lang=get('lang','ja');if(lang!=='ja'&&lang!=='en')lang='ja';
  var theme=get('theme','dark');if(theme!=='light'&&theme!=='dark')theme='dark';
  var cur=0;var h=(location.hash||'').replace('#','');
  EX.forEach(function(e,i){if(e.id===h)cur=i});
  function t(o){return o?(o[lang]||o.ja||''):''}
  function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined&&txt!==null)n.textContent=txt;return n}
  function $(id){return document.getElementById(id)}
  var toastTimer;
  function toast(msg){var x=$('toast');x.textContent=msg;x.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){x.classList.remove('on')},1800)}
  function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}document.body.removeChild(ta);return ok}
  function copy(text,btn){
    function good(){btn.textContent=t(UI.copied);toast(t(UI.copied));setTimeout(function(){btn.textContent=t(UI.copy)},1600)}
    function bad(){toast(t(UI.copyFail))}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(good,function(){fallbackCopy(text)?good():bad()})}
    else{fallbackCopy(text)?good():bad()}
  }
  function download(f){try{var bin=atob(f.b64),n=bin.length,u=new Uint8Array(n);for(var k=0;k<n;k++)u[k]=bin.charCodeAt(k);
    var blob=new Blob([u],{type:/\.docx$/.test(f.name)?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=f.name;a.style.display='none';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},4000)}catch(err){toast(t(UI.copyFail))}}
  function go(i){cur=Math.max(0,Math.min(N,i));try{history.replaceState(null,'','#'+EX[cur].id)}catch(e){}render();$('scroll').scrollTop=0;window.scrollTo(0,0)}
  function renderNav(){
    var nav=$('nav');nav.textContent='';
    EX.forEach(function(e,i){
      var b=el('button');b.type='button';if(i===cur)b.setAttribute('aria-current','true');
      b.appendChild(el('span','num',String(i)));
      var w=el('span');w.appendChild(el('div','nt',t(e.nav)));w.appendChild(el('div','ns',t(e.navSub)));b.appendChild(w);
      b.addEventListener('click',function(){go(i)});nav.appendChild(b);
    });
  }
  function section(e,i){
    var s=el('section','ex'+(i===cur?' active':''));
    var hero=el('div','hero');var hl=el('div');
    var label=i===0?t(UI.kinds.start):t(UI.activity)+' '+i+' · '+t(UI.kinds[e.kind]);
    hl.appendChild(el('div','kick caps',label));
    hl.appendChild(el('h2',null,t(e.title)));
    hl.appendChild(el('p',null,t(e.desc)));
    hero.appendChild(hl);
    var sk=el('div','skill');sk.appendChild(el('div','caps',t(UI.skill)));sk.appendChild(el('div','v',t(e.skill)));sk.appendChild(el('div','f',t(e.features)));hero.appendChild(sk);
    s.appendChild(hero);
    if(e.notes&&e.notes.length){var ul=el('ul','notes');e.notes.forEach(function(n){ul.appendChild(el('li',null,t(n)))});s.appendChild(ul)}
    if(e.apps){var pa=el('div','panel');pa.appendChild(el('div','caps',t(e.appsEyebrow)));pa.appendChild(el('h3',null,t(e.appsTitle)));pa.appendChild(el('p',null,t(e.appsIntro)));
      var ag=el('div','ings');e.apps.forEach(function(c){var x=el('div','ing');if(c.icon){var im=el('img','appicon');im.src=c.icon;im.alt='';im.width=44;im.height=44;x.appendChild(im)}x.appendChild(el('h4',null,t(c.t)));x.appendChild(el('div','q',t(c.q)));x.appendChild(el('p',null,t(c.d)));ag.appendChild(x)});pa.appendChild(ag);s.appendChild(pa)}
    (e.samples||(e.sample?[e.sample]:[])).forEach(function(sm){var ps=el('div','panel');ps.appendChild(el('div','caps',t(sm.eyebrow)));ps.appendChild(el('h3',null,t(sm.title)));ps.appendChild(el('p',null,t(sm.intro)));
      var db=el('button','copy dl',t(UI.download));db.type='button';db.addEventListener('click',function(){download(sm)});ps.appendChild(db);ps.appendChild(el('div','fname',sm.name));s.appendChild(ps)})
    if(e.video){var pv2=el('div','panel');pv2.appendChild(el('div','caps',t(e.video.eyebrow)));pv2.appendChild(el('h3',null,t(e.video.title)));pv2.appendChild(el('p',null,t(e.video.intro)));
      var vd=el('video','vid');vd.controls=true;vd.preload='metadata';vd.setAttribute('playsinline','');vd.setAttribute('aria-label',t(e.video.title));
      var fb=el('p','vfall',t(e.video.fallback));fb.style.display='none';
      vd.addEventListener('error',function(){vd.style.display='none';fb.style.display='block'});vd.src=e.video.file;
      pv2.appendChild(vd);pv2.appendChild(fb);s.appendChild(pv2)}
    if(e.cards){var g=el('div','grid3');e.cards.forEach(function(c,k){var cd=el('div','card');cd.appendChild(el('div','n',String(k+1)));cd.appendChild(el('h4',null,t(c.t)));cd.appendChild(el('p',null,t(c.d)));g.appendChild(cd)});s.appendChild(g)}
    if(e.flow){var p1=el('div','panel');p1.appendChild(el('div','caps',t(e.flowTitle)));p1.appendChild(el('h3',null,t(e.flowHead)));p1.appendChild(el('p',null,t(e.flowIntro)));
      var st=el('div','steps');e.flow.forEach(function(c,k){var x=el('div','step');var cc=el('div','c');cc.appendChild(el('b',null,'0'+(k+1)));cc.appendChild(el('i'));x.appendChild(cc);x.appendChild(el('h4',null,t(c.t)));x.appendChild(el('p',null,t(c.d)));st.appendChild(x)});p1.appendChild(st);s.appendChild(p1)}
    if(e.ing){var p2=el('div','panel');p2.appendChild(el('div','caps',t(e.ingEyebrow)));p2.appendChild(el('h3',null,t(e.ingTitle)));p2.appendChild(el('p',null,t(e.ingIntro)));
      var ig=el('div','ings');e.ing.forEach(function(c){var x=el('div','ing');x.appendChild(el('h4',null,t(c.t)));x.appendChild(el('div','q',t(c.q)));x.appendChild(el('p',null,t(c.d)));ig.appendChild(x)});p2.appendChild(ig);p2.appendChild(el('div','remember',t(e.remember)));s.appendChild(p2)}
    if(e.prompts&&e.prompts.length){
      var sh=el('div','sechead');sh.appendChild(el('h3',null,t(UI.prompts)));sh.appendChild(el('span',null,t(UI.count).replace('{n}',e.prompts.length)));s.appendChild(sh);
      e.prompts.forEach(function(p){
        var pc=el('div','prompt');var ph=el('div','ph');
        var left=el('div');left.appendChild(el('div','pid',p.id));left.appendChild(el('div','pt',t(p.title)));if(p.app){left.appendChild(el('div','pa',t(p.app)))}ph.appendChild(left);
        if(p.view){ph.appendChild(el('span','view',t(UI.viewOnly)))}
        else{var cb=el('button','copy',t(UI.copy));cb.type='button';cb.setAttribute('aria-label',t(UI.copy)+' '+p.id+': '+t(p.title));cb.addEventListener('click',function(){copy(t(p.text),cb)});ph.appendChild(cb)}
        pc.appendChild(ph);var pb=el('div','pb');pb.appendChild(el('p','ptext',t(p.text)));
        var hw=el('p','how');hw.appendChild(el('b',null,t(UI.how)));hw.appendChild(document.createTextNode(t(p.how)));if(p.link){hw.appendChild(document.createTextNode(' '));var lk=el('a','lnk',t(p.link.label));lk.href=p.link.url;lk.target='_blank';lk.rel='noopener noreferrer';hw.appendChild(lk)}pb.appendChild(hw);pc.appendChild(pb);
        s.appendChild(pc);
      });
    }
    var pg=el('div','pager');
    var pv=el('button','pg','← '+t(UI.prev));pv.type='button';if(i===0)pv.disabled=true;pv.addEventListener('click',function(){go(i-1)});
    var nx=el('button','pg nextb',(i===0?t(UI.begin):t(UI.next))+' →');nx.type='button';if(i===N)nx.disabled=true;nx.addEventListener('click',function(){go(i+1)});
    pg.appendChild(pv);pg.appendChild(nx);s.appendChild(pg);
    return s;
  }
  function render(){
    document.documentElement.lang=lang;document.documentElement.setAttribute('data-theme',theme);
    document.title=t(EX[cur].nav)+' | CCBJI '+t(M.brand);
    $('eyebrow').textContent=t(M.eyebrow);$('brand').textContent=t(M.brand);$('choose').textContent=t(UI.choose);
    $('countAll').textContent=t(UI.countAll).replace('{n}',N);
    $('guide').textContent=t(M.guide);$('guideSub').textContent=t(M.guideSub);
    $('btnLang').textContent=t(UI.lang);$('btnTheme').textContent=t(UI.theme);$('btnPrint').textContent=t(UI.print);
    $('progText').textContent=cur===0?t(UI.kinds.start):t(UI.of).replace('{i}',cur).replace('{n}',N);
    $('fill').style.inlineSize=(cur/N*100)+'%';
    var tr=$('track');tr.setAttribute('aria-valuemax',N);tr.setAttribute('aria-valuenow',cur);
    $('fFict').textContent=t(UI.fictional);$('fNote').textContent=t(UI.footer);
    $('fVer').textContent=t(UI.version)+' '+M.version+' · '+t(M.date);
    renderNav();
    var st=$('stage');st.textContent='';EX.forEach(function(e,i){st.appendChild(section(e,i))});
  }
  $('btnLang').addEventListener('click',function(){lang=lang==='ja'?'en':'ja';set('lang',lang);render()});
  $('btnTheme').addEventListener('click',function(){theme=theme==='dark'?'light':'dark';set('theme',theme);render()});
  $('btnPrint').addEventListener('click',function(){window.print()});
  document.addEventListener('keydown',function(ev){if(ev.altKey&&ev.key==='ArrowRight')go(cur+1);if(ev.altKey&&ev.key==='ArrowLeft')go(cur-1)});
  render();
})();
</script>
