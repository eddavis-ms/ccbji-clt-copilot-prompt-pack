<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>CCBJI Copilot プロンプトパック</title>
<style>
:root{--side:#ffffff;--bg:#f1efed;--bar:#ffffff;--surface:#ffffff;--inset:#f6f4f2;--ink:#1c1b1a;--muted:#5f5b58;--line:#dedad6;--accent:#d91e2a;--accent-ink:#ffffff;--track:#d5d0cc;--active:#f3eeeb;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark){:root{--side:#232222;--bg:#3b3a39;--bar:#2b2a2a;--surface:#2b2a2a;--inset:#343332;--ink:#f1efed;--muted:#aaa6a2;--line:#444241;--accent:#f0474f;--accent-ink:#ffffff;--track:#5a5857;--active:#353433;--shadow:0 2px 10px rgba(0,0,0,.25)}}
:root[data-theme="light"]{--side:#ffffff;--bg:#f1efed;--bar:#ffffff;--surface:#ffffff;--inset:#f6f4f2;--ink:#1c1b1a;--muted:#5f5b58;--line:#dedad6;--accent:#d91e2a;--accent-ink:#ffffff;--track:#d5d0cc;--active:#f3eeeb;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06)}
:root[data-theme="dark"]{--side:#232222;--bg:#3b3a39;--bar:#2b2a2a;--surface:#2b2a2a;--inset:#343332;--ink:#f1efed;--muted:#aaa6a2;--line:#444241;--accent:#f0474f;--accent-ink:#ffffff;--track:#5a5857;--active:#353433;--shadow:0 2px 10px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,system-ui,sans-serif;font-size:16px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.caps{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.app{display:grid;grid-template-columns:340px minmax(0,1fr);height:100vh}
.side{background:var(--side);display:flex;flex-direction:column;min-height:0;border-inline-end:1px solid var(--line)}
.sidehead{display:flex;gap:16px;align-items:center;padding:26px 24px 24px;border-block-end:1px solid var(--line)}
.logo{inline-size:84px;flex:none;display:block}
.logo svg{display:block;inline-size:100%;block-size:auto}
.logo span{display:block;text-align:center;font-size:8px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-block-start:3px;white-space:nowrap}
.sidehead .caps{color:var(--muted)}
.brand{font-size:19px;font-weight:600;line-height:1.3;margin-block-start:2px}
.choose{padding:22px 24px 8px;color:var(--muted)}
.nav{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:4px}
.nav button{display:grid;grid-template-columns:30px 1fr;column-gap:12px;align-items:start;text-align:start;background:none;border:1px solid transparent;border-radius:12px;padding:12px 12px 13px}
.nav button:hover{background:var(--active)}
.nav button[aria-current="true"]{background:var(--active);border-color:var(--line)}
.num{inline-size:30px;block-size:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.nt{font-size:15px;font-weight:700;line-height:1.4;padding-block-start:2px}
.ns{font-size:12.5px;color:var(--muted);line-height:1.4;margin-block-start:6px}
.sidefoot{padding:14px 24px;border-block-start:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
.dot{inline-size:7px;block-size:7px;border-radius:50%;background:var(--accent);flex:none}
.right{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{background:var(--bar);border-block-end:1px solid var(--line);padding:14px 40px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar h1{font-size:15px;margin:0;line-height:1.4}
.bar p{margin:0;color:var(--muted);font-size:12.5px}
.barright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.track{inline-size:110px;block-size:5px;border-radius:99px;background:var(--track);overflow:hidden}
.fill{block-size:100%;background:var(--accent);border-radius:99px;transition:inline-size .25s}
.tool{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.tool:hover{border-color:var(--accent);color:var(--ink)}
.scroll{flex:1;min-height:0;overflow-y:auto}
.main{padding:44px 40px 56px;max-inline-size:1000px}
section.ex{display:none}
section.ex.active{display:block}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:32px;align-items:start}
.kick{display:flex;align-items:center;gap:10px;color:var(--accent)}
.kick::before{content:"";inline-size:28px;block-size:3px;background:var(--accent);border-radius:2px}
.hero h2{font-size:clamp(28px,3.6vw,42px);line-height:1.25;margin:12px 0 16px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted);font-size:17px;line-height:1.75}
.skill{background:var(--surface);border:1px solid var(--line);border-block-start:3px solid var(--accent);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.skill .caps{color:var(--muted);font-size:11px}
.skill .v{font-weight:700;font-size:16px;margin:8px 0 10px;line-height:1.4}
.skill .f{font-size:13.5px;color:var(--muted);line-height:1.6}
.notes{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.notes li{font-size:14px;padding:11px 16px;border-inline-start:3px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0;color:var(--muted)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:38px 0 14px}
.sechead h3{font-size:17px;margin:0}
.sechead span{font-size:13px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-block-start:34px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.card .n{inline-size:30px;block-size:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.card h4{margin:14px 0 8px;font-size:17px;line-height:1.4}
.card p{margin:0;font-size:14.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:var(--shadow);margin-block-start:28px}
.panel .caps{color:var(--accent)}
.panel h3{font-size:24px;line-height:1.35;margin:8px 0 10px}
.panel>p{margin:0;color:var(--muted);font-size:15.5px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px;margin-block-start:30px}
.step .c{display:flex;align-items:center;gap:0}
.step .c b{inline-size:36px;block-size:36px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:12px;flex:none}
.step .c i{flex:1;block-size:2px;background:var(--track);margin-inline-start:8px}
.step h4{margin:16px 0 6px;font-size:16px;line-height:1.4}
.step p{margin:0;font-size:14px;color:var(--muted)}
.ings{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-block-start:26px}
.ing{background:var(--inset);border-radius:12px;padding:18px}
.ing h4{margin:0 0 6px;font-size:16px;color:var(--accent)}
.ing .q{font-size:14.5px;font-weight:700;margin-block-end:6px}
.ing p{margin:0;font-size:14px;color:var(--muted)}
.vid{display:block;inline-size:100%;max-block-size:70vh;background:#000;border-radius:12px;margin-block-start:22px}.vfall{margin-block-start:22px!important;padding:16px 18px;border:1px dashed var(--line);border-radius:12px;background:var(--inset)}.dl{margin-block-start:22px;font-size:14px;padding:11px 18px}.fname{margin-block-start:10px;font-size:12.5px;color:var(--muted)}
.mind{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-block-start:20px}.mindc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}.mindi{display:block;inline-size:100%;block-size:210px;object-fit:contain;background:#f9f9f9;border-block-end:1px solid var(--line)}.mindc h4{margin:16px 20px 4px;font-size:18px}.mindc p{margin:0 20px 18px;font-size:14.5px;font-weight:600}
.appicon{display:block;inline-size:44px;block-size:44px;object-fit:contain;margin-block-end:12px}
.exm{margin-block-start:20px;border:1px solid var(--line);border-radius:12px;padding:16px 18px}.exmh{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:6px}.exmh .moreh{margin:0}.exmr{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:7px 0;border-top:1px dashed var(--line);align-items:baseline}.exmk{font-size:12.5px;font-weight:700;color:var(--accent)}.exmt{font-size:15px;line-height:1.7}@media(max-width:560px){.exmr{grid-template-columns:1fr;gap:2px}}
:root{--k0:#1f5fb8;--k1:#17725a;--k2:#8a2bb5;--k3:#a84e12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--k0:#8ab8ff;--k1:#62d3ab;--k2:#d79af5;--k3:#f2a368}}
:root[data-theme="dark"]{--k0:#8ab8ff;--k1:#62d3ab;--k2:#d79af5;--k3:#f2a368}
.ing.kc{background:var(--surface);border:1px solid var(--line);border-block-start:3px solid var(--kc)}.ing.kc h4{color:var(--kc)}.ing .exl{margin-block-start:12px;padding-block-start:10px;border-block-start:1px solid var(--line);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.ing .exv{font-size:14.5px;font-weight:700;line-height:1.6;color:var(--kc);margin-block-start:4px}
.k0{--kc:var(--k0)}.k1{--kc:var(--k1)}.k2{--kc:var(--k2)}.k3{--kc:var(--k3)}
.exmp{margin:8px 0 0;font-size:17px;line-height:1.85;font-style:italic;font-weight:600}.exmp span{color:var(--kc)}
.bws{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-block-start:22px}.bw{background:var(--inset);border-radius:12px;padding:18px;display:flex;flex-direction:column}.bw .bwh{margin:-18px -18px 16px;inline-size:calc(100% + 36px);box-sizing:border-box;flex:none;border-radius:12px 12px 0 0;overflow:hidden;aspect-ratio:1080/700;display:grid;place-items:center;background:#e9eaff}.bw .bwh img{display:block;inline-size:100%;block-size:100%;object-fit:cover}.bw .bwh.logo{background:#fbf0f0}.bw .bwh.logo img{inline-size:30%;block-size:auto;object-fit:contain}.bw .bwi{inline-size:40px;block-size:40px;margin-block-end:10px}.bw h4{margin:0 0 8px;font-size:16px}.bw ol,.site ol{margin:0;padding-inline-start:20px;font-size:14.5px;line-height:1.8}.bw .bwn{font-size:13px;color:var(--muted);margin:10px 0 0}.bw a.open{display:inline-block;margin-block-start:14px;align-self:flex-start;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14.5px;text-decoration:none;padding:10px 16px;border-radius:10px}.bw a.open:hover{filter:brightness(.9)}.bw a.open:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bwt{margin-block-start:16px;padding:14px 18px;border-radius:12px;border:1px solid var(--line);font-size:14.5px}.bwt b{display:block;margin-block-end:4px}
@media print{.bw a.open{border:1px solid #000;color:#000;background:none}}
.remember{margin-block-start:20px;padding:14px 18px;border-radius:12px;background:var(--inset);font-size:14.5px;border-inline-start:3px solid var(--accent)}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-block-end:18px;overflow:hidden}
.ph{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding:20px 22px 18px;border-block-end:1px solid var(--line)}
.pid{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.04em}
.pt{font-weight:700;font-size:17px;line-height:1.45;margin-block-start:2px}
.pa{font-size:13px;color:var(--muted);margin-block-start:4px}
.copy{background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:8px 18px;font-size:13px;font-weight:700;flex:none;white-space:nowrap}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.view{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--inset);border:1px dashed var(--line);border-radius:12px;padding:7px 12px;flex:none;max-inline-size:280px;line-height:1.4;text-align:center}
.pb{padding:20px 22px 22px}
.ptext{margin:0;white-space:pre-wrap;font-size:16px;line-height:1.85}
.how{margin:18px 0 0;font-size:13.5px;color:var(--muted);background:var(--inset);border-radius:10px;padding:11px 16px}
.more{margin:16px 0 0;border-top:1px dashed var(--line);padding-top:14px}.moreh{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.04em;margin-bottom:8px}.morer{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 0}.moret{font-size:14.5px;line-height:1.7}.moren{font-size:13px;color:var(--muted);margin-top:6px}
.how.find{background:transparent;border:1px solid var(--accent);border-inline-start-width:5px}.how.find+.how{margin-top:10px}
.opt{display:inline-block;margin-inline-start:10px;padding:1px 9px;border:1px solid currentColor;border-radius:999px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.act{margin:16px 0 0;border:1px solid var(--line);border-inline-start:5px solid var(--accent);border-radius:10px;padding:13px 16px}.acth{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.actt{font-weight:700;font-size:15.5px;margin:3px 0 4px}.actx{margin:0;font-size:14px}.actn{margin:8px 0 0;font-size:13px;color:var(--muted)}
.how a.lnk{color:var(--accent);font-weight:600;text-decoration:underline;white-space:nowrap}
.how b{color:var(--accent);margin-inline-end:10px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-block-start:30px}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 20px;font-size:14px;font-weight:700}
.pg:hover{border-color:var(--accent)}
.pg[disabled]{opacity:.35;cursor:default}
.pg.nextb{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
footer{margin-block-start:40px;padding-block-start:16px;border-block-start:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer p{margin:0 0 4px}
.toast{position:fixed;inset-block-end:24px;inset-inline:0;margin-inline:auto;inline-size:max-content;max-inline-size:90vw;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:1100px){.app{grid-template-columns:270px minmax(0,1fr)}.sidehead{padding:20px 16px;gap:12px}.logo{inline-size:64px}.brand{font-size:16px}.choose{padding-inline:16px}.nav{padding-inline:8px}.sidefoot{padding-inline:16px}.bar{padding-inline:24px}.main{padding:32px 24px 48px}.hero{grid-template-columns:1fr}}
@media (max-width:640px){.app{grid-template-columns:1fr;height:auto}.side{border-inline-end:none;border-block-end:1px solid var(--line)}.nav{max-block-size:230px}.scroll{overflow:visible}.right{min-height:auto}}
@media print{.side,.barright,.pager,.copy,.toast{display:none}.app{display:block;height:auto}.scroll{overflow:visible}section.ex{display:block;break-before:page}section.ex:first-of-type{break-before:auto}.card,.prompt,.panel,.skill{box-shadow:none;break-inside:avoid}.main{padding:16px 0;max-inline-size:none}}

.side{border-inline-end:1px solid var(--line)}
.sidehead{position:relative;flex-direction:column;align-items:flex-start;gap:16px;border:0;padding:26px 24px 40px;color:#fff;background:var(--b-down) bottom/100% 18px no-repeat,linear-gradient(var(--red),var(--red)) top/100% calc(100% - 17px) no-repeat}
.sidehead .caps{color:rgba(255,255,255,.9)}
.sidehead .brand{color:#fff}
.logo{inline-size:176px;padding:20px 26px 16px;background:var(--b-box) center/100% 100% no-repeat}
.logo span{color:#55504c}
.choose{padding-block-start:14px}
.sidefoot{border:0;color:#fff;padding:26px 24px 12px;background:var(--b-up) top/100% 18px no-repeat,linear-gradient(var(--red),var(--red)) bottom/100% calc(100% - 17px) no-repeat}
.sidefoot .dot{background:#fff}
.right::after{content:"";flex:none;block-size:34px;background:var(--b-up) top/100% 18px no-repeat,linear-gradient(var(--red),var(--red)) bottom/100% calc(100% - 17px) no-repeat}
.bar h1{color:var(--accent)}
.hero h2{color:var(--accent);padding-block-end:14px;background:var(--b-stroke) left bottom/220px 9px no-repeat}
.kick::before{inline-size:44px;block-size:8px;border-radius:0;background:var(--b-stroke) center/100% 100% no-repeat}
.copy{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.copy:hover{color:var(--accent-ink);filter:brightness(.9)}
.card{border-block-start:3px solid var(--accent)}
@media (max-width:1100px){.sidehead{padding:20px 16px 36px}.logo{inline-size:150px}}
@media print{.right::after{display:none}}

: {"ja": "準備とフォローアップ", "en": "Prepare and follow up"}, "d": {"ja": "会議に備え、会議後のフォローアップを行います。", "en": "Get ready for your meetings and follow up afterward."}}, {"t": {"ja": "判断する", "en": "Decide"}, "d": {"ja": "販売データを問い直し、ブリーフィングと意思決定プレゼンテーションにまとめます。", "en": "Question the sales data, then turn it into a briefing and a decision presentation."}}], "ingEyebrow": {"ja": "テクニック", "en": "The technique"}, "ingTitle": {"ja": "よいプロンプトの4つの要素", "en": "Four ingredients of a useful prompt"}, "ingIntro": {"ja": "完璧なプロンプトは必要ありません。まず得たい結果を伝え、必要に応じて次の要素を加えてください。", "en": "You do not need a perfect prompt. Start with the outcome you want, then add these as needed."}, "ing": [{"t": {"ja": "目的", "en": "Goal"}, "q": {"ja": "Copilotに何をしてほしいですか。", "en": "What do you want Copilot to do?"}, "d": {"ja": "要約、比較、分析、下書き、提案など、依頼内容を明確にします。", "en": "State the task clearly: summarize, compare, analyze, draft or recommend."}}, {"t": {"ja": "背景", "en": "Context"}, "q": {"ja": "なぜ必要で、誰が関係しますか。", "en": "Why do you need it, and who is involved?"}, "d": {"ja": "相手、事業の状況、優先事項、制約、準備している判断を伝えます。", "en": "Add the audience, business situation, priorities, constraints and the decision being prepared."}}, {"t": {"ja": "情報源", "en": "Source"}, "q": {"ja": "どの情報を使うべきですか。", "en": "Which information should Copilot use?"}, "d": {"ja": "対象の文書、ブック、メール、会議、またはWebを指定します。", "en": "Point to the document, workbook, email thread, meeting or the web."}}, {"t": {"ja": "期待する形式", "en": "Expectations"}, "q": {"ja": "どのように答えてほしいですか。", "en": "How should Copilot respond?"}, "d": {"ja": "形式、詳しさ、トーン、根拠の示し方を指定します。", "en": "Define the format, level of detail, tone and evidence you expect."}}], "remember": {"ja": "プロンプトは対話です。回答を確認し、足りない点を尋ねてください。例：「この中で、どのアクションを優先すべきですか。その理由も教えてください。」", "en": "Keep the conversation going. Review the answer and ask for what is missing. Try: \"Which of these actions should I prioritize, and why?\""}, "prompts": [], "notes": [], "example": {"head": {"ja": "4つの要素を1つのプロンプトに", "en": "Put the ingredients together"}, "parts": [{"k": {"ja": "目的", "en": "Goal"}, "t": {"ja": "コマーシャル業績のブリーフィングを作成してください。", "en": "Create a commercial performance briefing"}}, {"k": {"ja": "背景", "en": "Context"}, "t": {"ja": "週次のビジネスレビューを前にした、リーダーシップチーム向けです。", "en": "for our leadership team ahead of the weekly business review,"}}, {"k": {"ja": "情報源", "en": "Source"}, "t": {"ja": "今週の販売スコアカードと、現場およびお客様に関する最新情報を使ってください。", "en": "using this week's sales scorecard and the latest field and customer updates."}}, {"k": {"ja": "期待する形式", "en": "Expectations"}, "t": {"ja": "業績上の最大のギャップと機会を要約し、リーダーシップの対応が必要な市場またはアカウントを特定し、期待されるコマーシャル面の効果とともに3つのアクションを表形式で提案してください。", "en": "Summarize the biggest performance gaps and opportunities, identify markets or accounts that need leadership attention, and recommend three actions with the expected commercial impact in a table."}}], "text": {"ja": "コマーシャル業績のブリーフィングを作成してください。週次のビジネスレビューを前にした、リーダーシップチーム向けです。今週の販売スコアカードと、現場およびお客様に関する最新情報を使ってください。業績上の最大のギャップと機会を要約し、リーダーシップの対応が必要な市場またはアカウントを特定し、期待されるコマーシャル面の効果とともに3つのアクションを表形式で提案してください。", "en": "Create a commercial performance briefing for our leadership team ahead of the weekly business review, using this week's sales scorecard and the latest field and customer updates. Summarize the biggest performance gaps and opportunities, identify markets or accounts that need leadership attention, and recommend three actions with the expected commercial impact in a table."}, "how": {"ja": "これは説明用の例です。色は、上の4つの要素に対応しています。実際に使うときは、ご自身のスコアカードや資料を指定してください。", "en": "An illustrative example: each color matches one of the four ingredients above. To use it for real, point Copilot to your own scorecard and updates."}}, "before": {"eyebrow": {"ja": "準備", "en": "Getting ready"}, "title": {"ja": "始める前に", "en": "Before we start"}, "intro": {"ja": "Windowsアプリ、またはWebのどちらかをお使いください。このページをCopilotの隣に開いたままにしておくと、プロンプトをコピーしながら進められます。", "en": "Choose the Windows app or the web. Keep this page open next to Copilot so you can copy prompts as you go."}, "cols": [{"t": s, compare them with the company's published priorities, then draft the email. Each level builds on the answer before it."}, "skill": {"ja": "段階的なプロンプト", "en": "Progressive prompting"}, "features": {"ja": "Work IQ、ファイルの追加、メールの下書き、Copilot Pages", "en": "Work IQ, adding a file, email drafting and Copilot Pages"}, "notes": [], "prompts": [{"id": "A1", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "レベル1：一文で尋ねる", "en": "Level 1: ask a one-line question"}, "text": {"ja": "この1週間のメール、会議、チャットをもとに、事業全体で大きくなりつつあり、私が関与すべき課題は何ですか。", "en": "Across my email, meetings and chats from the last week, what issues are building across the business that need me to step in?"}, "how": {"ja": "Work IQ：Copilotは、ご自身のメール、会議、チャット、ファイルを横断して読み取り、根拠となった情報源を表示します。参照するのは、ご自身にアクセス権のある情報だけです。レベル1から4は、同じ会話の中で続けて実行してください。", "en": "Work IQ: Copilot reads across your email, meetings, chats and files and shows the sources it used. It uses only what you already have permission to see. Run Levels 1 to 4 in the same conversation."}}, {"id": "A2", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "レベル2：具体的な内容と形式を指定する", "en": "Level 2: ask for specifics and a format"}, "text": {"ja": "このうち、今後2週間以内に私の判断が必要なものを3つ挙げてください。判断の内容、担当部門、関係者、期限、判断が遅れた場合の影響（一行）を表で示してください。", "en": "Which three of these need a decision from me in the next two weeks? Show a table with the decision, the function, who is involved, the deadline and what is at stake in one line."}, "how": {"ja": "よいプロンプトは、何を、どの程度の詳しさで、どの形式で返してほしいかを伝えます。", "en": "Better prompts say what you want back, the level of detail and the format."}}, {"id": "A3", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "レベル3：ファイルを追加する", "en": "Level 3: add a file"}, "text": {"ja": "添付の統合報告書を読み、会社が掲げる優先課題を、この1週間に私のリーダーシップチームが議論してきた内容と比較してください。どの優先課題が順調で、どれにリスクがあるかを、それぞれ一行の理由とともに示してください。最後に、チームに投げかけるべき質問を3つ挙げてください。", "en": "Read the attached integrated report and compare the company's stated priorities with what my leadership team has been discussing over the last week. Show which priorities are on track or at risk with a one-line reason, then give me three questions to put to my team."}, "how": {"ja": "下のリンクから統合報告書2026（PDF）をダウンロードし、プロンプトを送信する前に、チャットの「＋」から添付します。OneDriveに保存した場合は、「/」を入力してファイルを選ぶこともできます。これは実際の公開資料で、サンプルデータではありません。回答を共有するには、回答の下にある「Pagesで編集」を選ぶと、Copilot Pageになります。", "en": "Download the Integrated Report 2026 (PDF) with the link below and attach it with the + button in the chat before you send the prompt. If you save it to OneDrive, you can also type / and pick the file. It is a real public document, not sample data. To share the answer, select Edit in Pages under it to turn it into a Copilot Page."}, "link": {"url": "CCBJ-Integrated-Report-2026.pdf", "download": "CCBJ-Integrated-Report-2026.pdf", "label": {"ja": "統合報告書2026（PDF、英語版）をダウンロード", "en": "Download Integrated Report 2026 (PDF)"}}, "more": [{"ja": "この報告書について、単なる要約ではなく、経営の視点でストーリーを説明してください。会社が掲げる優先課題と目標、報告されている進捗、強調されているリスクは何ですか。", "en": "Give me the executive story of this report, not just a summary: the company's stated priorities and targets, the progress it reports and the risks it highlights."}, {"ja": "これらの優先課題に対する進捗を確かめるために、リーダーが販売データに対して問うべき質問を5つ挙げてください。", "en": "What five questions should a leader ask of the sales data to check progress against these priorities?"}], "moreNote": {"ja": "アクティビティ3では、このような質問を販売データに問いかけます。", "en": "In activity 3, you will put questions like these to the sales data."}}, {"id": "A4", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "レベル4：メールを下書きする", "en": "Level 4: draft the email"}, "text": {"ja": "リスクのある優先課題と3つの質問を伝え、[次回のリーダーシップ会議]までに回答を求めるメールを、[私の直属の部下]宛てに下書きしてください。150語以内にまとめてください。", "en": "Draft an email to [my direct reports] with the priorities at risk and the three questions, asking for their answers before [our next leadership meeting]. Keep it under 150 words."}, "how": {"ja": "Copilotがチャットの中でメールを下書きします。その場で内容を確認・編集し、チャットから送信できます。より細かく編集したい場合は、下書きをOutlookで開くこともできます。ご自身が送信を選ぶまで、メールは送信されません。", "en": "Copilot drafts the email in the chat, where you can review it, edit it and send it. For full editing features, you can also open the draft in Outlook. Nothing is sent until you choose to send it."}}]}, {"id": "week", "kind": "try", "nav": {"ja": "準備とフォローアップ", "en": "Prepare and follow up"}, "navSub": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "準備とフォローアップ", "en": "Prepare and follow up"}, "desc": {"ja": "リーダーの一週間は、会議を中心に進みます。Copilotを使って、前回の会議を振り返り、次の会議に備え、会議後のフォローアップを行います。", "en": "Much of a leader's week runs through meetings. Use Copilot to catch up on the last one, prepare for the next one and follow up afterward."}, "skill": {"ja": "準備し、フォローアップし、伝える", "en": "Preparing, following up and communicating"}, "features": {"ja": "会議の振り返り、会議の準備、フォローアップのメール、二言語での作成", "en": "Meeting recap, meeting preparation, follow-up email and writing in two languages"}, "notes": [], "prompts": [{"id": "B1", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "前回の会議を振り返る", "en": "Recap my last leadership meeting"}, "text": {"ja": "前回のリーダーシップ会議の主な決定事項と未完了のアクションを、担当者とあわせてまとめてください。", "en": "Summarize the key decisions and open actions from my last leadership meeting, with an owner for each action."}, "how": {"ja": "会議名を指定すると、より正確な回答になります。", "en": "Name the meeting for a more precise answer."}}, {"id": "B2", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "重要な面談に備える", "en": "Prepare for an important meeting"}, "text": {"ja": "[相手または会議名]との次回の面談に向けて準備をしたいです。これまでの経緯、先方の要望、当社の現在の立場、私が伝えるべき3つのポイントを、1ページにまとめてください。", "en": "Help me prepare for my next meeting with [person or meeting name]. On one page, summarize the background, what they are asking for, our current position, and three points I should make."}, "how": {"ja": "お客様とのトップ面談や、重要な社内会議の準備に適しています。", "en": "Works well for a top-to-top customer meeting or an important internal review."}}, {"id": "B3", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "会議後のフォローアップ", "en": "Follow up after a meeting"}, "text": {"ja": "[相手または会議名]との直近の会議について、フォローアップのメールを下書きしてください。決定事項を確認し、各アクションの担当者と期限を一覧にし、未解決の論点を記載してください。簡潔で丁寧なビジネス文にしてください。", "en": "Draft a follow-up email for my last meeting with [person or meeting name]. Confirm the decisions made, list each action with its owner and due date, and note any open questions. Keep it brief and professional."}, "how": {"ja": "Copilotが作成するのは下書きのみです。内容を確認・修正したうえで、ご自身で送信してください。", "en": "Copilot prepares a draft only. Review and edit it before you send it yourself."}}, {"id": "B4", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "二つの言語で伝える", "en": "Communicate in two languages"}, "text": {"ja": "[テーマ]について、リーダーシップチーム向けの短い報告を英語で下書きしてください。続けて、同じ内容を自然なビジネス日本語で書いてください。", "en": "Draft a short update for the leadership team on [topic] in English, then the same message in natural business Japanese."}, "how": {"ja": "トーンや長さは、続けて指示すれば調整できます。自動で送信されることはありません。", "en": "Ask a follow-up to adjust tone or length. Nothing is sent on your behalf."}}]}, {"id": "plan", "kind": "try", "nav": {"ja": "データから意思決定へ", "en": "From data to decision"}, "navSub": {"ja": "リサーチツール、Excel、ワークスペース、PowerPoint", "en": "Researcher, Excel, Workspaces, PowerPoint"}, "title": {"ja": "データから意思決定へ", "en": "From data to decision"}, "desc": {"ja": "数字が出そろいました。売上はほぼ横ばい、数量は減少し、利益は自動販売機や顧客によって大きく異なります。どこに手を打つかを決める前に、リーダーが必要とするのは、外部の視点、データが何を示しているかの把握、判断材料を一つにまとめたブリーフィングの3つです。", "en": "The numbers are in. Sales are roughly flat, volume is down, and profit varies widely by machine and by customer. Before deciding where to act, a leader needs three things: an outside view, a clear picture of what the data says, and a briefing that brings the evidence together and frames the choice."}, "skill": {"ja": "データを問い直し、意思決定を整理する", "en": "Questioning the data and framing the decision"}, "features": {"ja": "リサーチツール、Copilot in Excel、ワークスペース、Copilot in PowerPoint", "en": "Researcher, Copilot in Excel, Workspaces, Copilot in PowerPoint"}, "notes": [], "appsEyebrow": {"ja": "はじめる前に", "en": "Before you start"}, "appsTitle": {"ja": "各ステップで使うアプリ", "en": "Where to run each step"}, "appsIntro": {"ja": "ステップごとに、使うアプリやエージェントが変わります。各プロンプトのタイトルの下にも表示しています。", "en": "Each step runs in a different app or agent. The same information appears under each prompt title."}, "apps": [{"t": {"ja": "リサーチツール", "en": "Researcher"}, "q": {"ja": "C1：外部の視点", "en": "C1: the outside view"}, "d": {"ja": "Microsoft 365 Copilot アプリで、エージェントの一覧から「リサーチツール」を選びます。", "en": "In the Microsoft 365 Copilot app, choose Researcher from the list of agents."}, "icon": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABICAYAAAAJZ/BjAAAhcElEQVR42uV9eZBdd3Xm953fvW/pRZI3sDE2BDsBjMcYbDajuC0KJ5WwVCC8rpDChJmwk5qhKKrC1FAj9cz8wWSrZDIYL6RCARMy3UWYMUsSx4XcJphA7GCEEcHGlh0wNjbIklrd/Zb7O2f++C3391qiMjZeE1e1+y1XT++e5Tvf+c65V8QT4T8zLlx/vVvdtaspX9657+4TBM2FRjsfIs+E6s/BcDqIkw2YJ9CDATCMAByC4RCM3wflDvP+DlS4uXGdr//duWceLD93Ye/eavWSSzxIe7xPnY+34QeArJA+vXTxNw8819C8CuIuMtWXEXiK688InYM2E5j3gPcwNUANMIAUQAQAQVdBqhrmPfzmpidwPyF/771fFZG/vOGCn/l2+rsGZm4F0MfTEXwiGP6VN920fdQ76XV0cpmp//lqbr6GKfzmEOYbmJkHYDATGggSIfIZvr/BYMEZABWghXOjE1fBdXsAiWb96MQMXyblE52Dk09fd+lZhx/vjHjMHTAwc8nwC7ceOFVN3wnhW6t+/3QY0GxuwMwamJEkARDBnIxwAxhBAGbxBOJrBgMRnRPeN5rBAA2Z4pzr9UHn4DfWD0D5p9g4cvXqrnPvA4DBsrmVxTYb/2U5wCwYk9Tz/vqW2W1Pn3+viLzH9WZO86MhdDLxMANJmfpeBoOFP2gWPZEcwegEi6eiQPtOcgAAMngnvKaAQequc90+/Pr6D2D4vc7hH1/1N794/vpuM1kC7LHKhsfEAbvNZInUgPG3vYad7n+TXv88v7EBnUwaAg7ksd+liPgU1UzPUUZ5zBDNxrcMT8khwY2EpfSAmplJ3XGuPwM/HH5L/OR9e1/6jGu3fucntQMGy8tuZXHRL9x665yx/3vsdN9BMzTDYROjXY5neFpKGgAa7AtY65D09S1mSQtVKRNa85fHhpxhft3MjPCu26+gCvX+w40/+h9v3PnctfTdn7QOWNi7t1rdtat52df2n9uZn/m49Gde0KwdUQtQwy1QE5BCi8gvI95aaAnP26fl8VNGNxZPWB5TfFb2g5JENb9dmvW1Wyaj8WVf2XX2rekcnnQOSMX24m/c/lr2eh+jkxOajY0GpOPWv9cAWkSHLYV12pj45yMe0xCF4yF56cx8THCqAU3Vn6nM64PabLzlhp3PuqYkDk8OBywvOywu+p3fuP1t7NSXE6h0MvHHFFgk48XCqqmYWhGxCXp4fGixLadxnEwInxCzJhTlBGfGWG3LXDEz76ragWia0eTdf7vrmVfDTPAo1AR5NGAHi4t+577b31 マーケット・オンラインの間でのチャネルの変化、主要な飲料メーカーや消費財メーカーが価格、自動化、AIについて進めている取り組みを含めてください。事実と意見を区別し、最後に、ボトラーのコマーシャル部門のリーダーシップチームにとって特に重要な示唆を5つ挙げてください。", "en": "Research the outlook for Japan's beverage business in 2027 and the forces shaping it: consumer spending and price sensitivity, population and labor trends, shifts between vending, convenience stores, supermarkets and online, and what major beverage and consumer goods companies are doing on pricing, automation and AI. Separate fact from opinion, and end with the five implications that matter most for a bottler's commercial leadership team."}, "how": {"ja": "リサーチツールは通常、調査を始める前に、レポートの長さなどについていくつか確認の質問をします。質問に答えると、より焦点の定まったレポートになります。「前提を置いて進めてください」と伝えて、そのまま進めることもできます。調査には数分かかり、結果はレポートとして表示されます。レポートができあがったら、Word文書に変換して保存してください。C9でワークスペース（またはノートブック）に追加します。", "en": "Expect Researcher to ask a few clarifying questions first, including how long the report should be. Taking the time to answer gives a more focused report; you can also tell it to proceed with its own assumptions. Research then takes a few minutes and is returned as a report. When the report is ready, convert it to a Word document and save it, so it is ready to add to your workspace (or notebook) in C9."}, "app": {"ja": "リサーチツール", "en": "Researcher"}, "more": [{"ja": "このレポートをWord文書に変換してください。", "en": "Convert this report to a Word document."}]}, {"id": "C2", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "プロンプトでダッシュボードを作る", "en": "Build a dashboard from a prompt"}, "text": {"ja": "Sales、Machines、Customersの各シートを使って、新しいシートにダッシュボードを作成してください。2026年1月～10月の純売上高、売上総利益（純売上高から製品原価を引いたもの）、限界利益を、2025年の同じ月と比較し、部門別とサブチャネル別に示してください。月次の純売上高推移グラフも追加してください。", "en": "Using the Sales, Machines and Customers sheets, build a dashboard on a new sheet. Show net sales revenue, gross profit (net sales revenue minus product cost) and marginal profit for January to October 2026 against the same months of 2025, by department and by subchannel. Add a monthly net sales revenue trend chart."}, "how": {"ja": "サンプルの販売データブックを開いた状態で、Excel内のCopilotで実行します。", "en": "Run it in Copilot in Excel, with the sample sales workbook open."}, "more": [{"ja": "日本語の列の横に、英語の列を追加してください。", "en": "Add English columns alongside the Japanese ones."}, {"ja": "ダッシュボードの計算に使っている非表示のシートを表示してください。内容を確認したいです。", "en": "Show the hidden calculation sheet behind the dashboard so I can review it."}, {"ja": "選択したセルの数式を、わかりやすい言葉で説明してください。", "en": "Explain the formula in the selected cell in plain language."}], "moreNote": {"ja": "3つ目は、ダッシュボードのセルを1つ選択してから実行します。", "en": "For the third one, select a cell on the dashboard first."}}, {"id": "C3", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "不振の自動販売機を見つける", "en": "Identify the underperformers"}, "text": {"ja": "2026年4月以降、限界利益の推移が最も弱い自動販売機を15台挙げてください。それぞれのサブチャネル、顧客名、手数料率、売り切れ日数を示し、「改善」「移設」「撤去」のいずれが適切かを理由とともに提案してください。", "en": "Which 15 machines have the weakest marginal profit trend since April 2026? For each, show the subchannel, customer name, commission rate and sold-out days, and suggest whether to fix, relocate or remove it, with your reasoning."}, "how": {"ja": "C2と同じ会話で続けて実行します。提案はあくまで出発点です。判断はご自身で行ってください。", "en": "Continue in the same conversation as C2. Treat the suggestions as a starting point; the decision is yours."}}, {"id": "C4", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "値上げは需要を損なっていないか", "en": "Are price increases costing us demand?"}, "text": {"ja": "値上げは需要を損なっていませんか。2026年1月～10月の純売上高の前年同期比の増減を、カテゴリー別に、価格による影響と数量による影響に分けて示してください。価格の上昇とともに販売数量が最も大きく減ったカテゴリーを示し、全体の販売数量の増減を、年率0.5～1%という長期の数量成長目標と比較してください。読み取れることを3点にまとめてください。", "en": "Are price increases costing us demand? Split the change in net sales revenue for January to October 2026 against the same months of 2025 into the effect of price and the effect of volume, by category. Show where higher prices came with the largest loss of units, and compare the overall change in units with a long-term volume growth target of 0.5 to 1 percent a year. Summarize what this tells us in three points."}, "how": {"ja": "統合報告書から導かれる問いの一例です。サンプルの販売データブックを開いた状態で、Excel内のCopilotで実行します。", "en": "This is one of the questions the integrated report raises. Run it in Copilot in Excel, with the sample sales workbook open."}}, {"id": "C5", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "供給と需要のずれを見つける", "en": "Find where supply missed demand"}, "text": {"ja": "地域別、月別に、ホット飲料とコールド飲料それぞれで売り切れ日数が最も多かったのはどこですか。Weatherシートの気温と比較し、供給が需要に追いつかなかった地域と月を説明してください。", "en": "By region and month, where were sold-out days highest for hot drinks and for cold drinks? Compare this with the temperatures in the Weather sheet and explain where supply did not keep up with demand."}, "how": {"ja": "サンプルの販売データブックを開いた状態で、Excel内のCopilotで実行します。", "en": "Run it in Copilot in Excel, with the sample sales workbook open."}}, {"id": "C6", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "この冬に備える", "en": "Prepare for the winter ahead"}, "text": {"ja": "Weatherシートの見通し（Outlook）を使って、2026年11月から2027年1月までのホット飲料の販売数量を地域別に予測してください。ホット飲料の品揃えを最初に増やすべき地域を挙げ、予測の前提も示してください。", "en": "Using the outlook rows in the Weather sheet, forecast hot-drink units by region for November 2026 to January 2027. List the regions where hot selections should be increased first, and state the assumptions behind the forecast."}, "how": {"ja": "予測は前提次第で変わります。必ず前提を確認してください。", "en": "A forecast is only as good as its assumptions, so check them."}}, {"id": "C7", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "利益の高い設置先を見極める", "en": "Find the high-profit locations"}, "text": {"ja": "利益の高い設置先は、全体を動かすほどの規模になっていますか。2026年1月～10月について、限界利益の上位20%の自動販売機が限界利益全体に占める割合を示し、1台あたりの限界利益が高い順にサブチャネルを並べてください。読み取れることを3点にまとめてください。", "en": "Are our high-profit locations large enough to move the business? For January to October 2026, show what share of total marginal profit comes from the top 20 percent of machines, and rank the subchannels by marginal profit per machine. Summarize what this tells us in three points."}, "how": {"ja": "統合報告書から導かれる問いの一例です。サンプルの販売データブックを開いた状態で、Excel内のCopilotで実行します。", "en": "This is one of the questions the integrated report raises. Run it in Copilot in Excel, with the sample sales workbook open."}, "more": [{"ja": "今後6か月以内に契約更新を迎える顧客のうち、限界利益が大きい上位5社を挙げ、それぞれについて、守るべき点または改善すべき点を1行で示してください。", "en": "List the five largest customers by marginal profit with a contract renewal in the next six months, and give one line for each on what to protect or what to fix."}]}, {"id": "C8", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "投資の効果を確かめる", "en": "Check that an investment is working"}, "text": {"ja": "AIによる品揃えを開始した自動販売機について、開始前と開始後の売り切れ日数と販売数量を比較してください。導入していない自動販売機とも比較し、効果があったと言えるかを説明してください。", "en": "For machines where AI assortment has started, compare sold-out days and units before and after the start. Compare them with machines that do not have it, and say whether the evidence shows it is working."}, "how": {"ja": "サンプルの販売データブックを開いた状態で、Excel内のCopilotで実行します。", "en": "Run it in Copilot in Excel, with the sample sales workbook open."}}, {"id": "C9", "title": {"ja": "ブリーフィングにまとめる", "en": "Bring it together in a briefing"}, "text": {"ja": "このワークスペースにあるすべての資料（外部調査、統合報告書、販売データブックの分析）をもとに、リーダーシップチーム向けのブリーフィングを作成してください。エグゼクティブサマリー、分析、それを裏づける根拠とグラフ、必要な重要な決定、提言、出典の一覧を含めてください。実際の公開報告書に基づく内容と、サンプルデータに基づく内容は、区別できるように示してください。", "en": "Using everything in this workspace (the outside research, the integrated report and the analysis in the sales workbook), write a briefing for the leadership team. Include an executive summary, the analysis, the evidence and charts that support it, the key decisions required, recommendations, and a list of sources. Keep what comes from the real published report clearly separate from what comes from the sample data."}, "how": {"ja": "先に、C1の調査レポート、アクティビティ1で使った統合報告書、分析を加えた販売データブックをワークスペース（またはノートブック）に追加します。できあがったブリーフィングを確認して磨き上げ、関係者と共有します。最後に、ブリーフィングをWord文書にします。ワークスペース（またはノートブック）のチャットで「@」と入力し、一覧から「Word」を選んでWordエージェントを呼び出してから、文書の作成を依頼してください。「@Word」を付けないと、Word文書が作成されないことがあります。C10では、この文書をもとにプレゼンテーションを作成します。", "en": "First add the research report from C1, the integrated report from activity 1 and the sales workbook with your analysis to the workspace (or notebook). Review and refine the briefing, then share it with your collaborators. Finally, turn the briefing into a Word document: in the workspace (or notebook) chat, type @ and choose Word from the list to call the Word agent, then ask it to create the document. Without @Word, Copilot may not create a Word document. C10 builds the presentation from it."}, "app": {"ja": "ワークスペース（または ノートブック）", "en": "Workspaces (or Notebooks)"}, "more": [{"ja": "このワークスペースの情報をもとに、判断の前に解決すべき問いは何か、それぞれ誰が担当すべきかを示してください。", "en": "Based on everything in this workspace, which questions remain unanswered before the decision, and who should own each one?"}, {"ja": "エグゼクティブサマリーを5行以内にまとめ直し、最初に必要な決定を示してください。", "en": "Tighten the executive summary to five lines and lead with the decision required."}, {"ja": "@Word このブリーフィングをWord文書として作成してください。", "en": "@Word Create a Word document from this briefing."}], "find": {"ja": "Microsoft 365 Copilot アプリの左側のパネルで、「ワークスペース」を選びます。「ワークスペース」が表示されていない場合は、「ノートブック」を選んでください。名称の変更が順次進んでいるため、お使いの環境によってどちらか一方が表示されます。どちらも同じ機能です。新しいワークスペース（またはノートブック）を作成し、資料を追加します。", "en": "In the Microsoft 365 Copilot app, look in the left-hand panel and select Workspaces. If you do not see Workspaces, select Notebooks instead. The name is changing, so you will see one or the other depending on your version; both are the same feature. Create a new workspace (or notebook), then add your material."}, "moreNote": {"ja": "3つ目は、コピーして貼り付けたあと、「@Word」を入力し直して一覧から「Word」を選ぶ必要がある場合があります。", "en": "For the third one, after pasting you may need to retype @Word and choose Word from the list so that the Word agent is called."}}, {"id": "C10", "app": {"ja": "Copilot in PowerPoint", "en": "Copilot in PowerPoint"}, "title": {"ja": "意思決定プレゼンテーションを作成する", "en": "Create the decision presentation"}, "text": {"ja": "このブリーフィング文書をもとに、リーダーシップチーム向けの3枚の意思決定プレゼンテーションを作成してください。背景ではなく、必要な決定から始めてください。1枚目は、自動販売機事業の利益の前年比とその要因です。2枚目は、ブリーフィングで示した選択肢と限界利益への影響、3枚目は推奨案と必要な決定事項です。各スライドの要点を発表者ノートに記載してください。", "en": "Using this briefing document, create a three-slide decision presentation for the leadership team. Lead with the decision required, not the background. Slide 1: where vending profit stands against last year, and why. Slide 2: the options from the briefing and their impact on marginal profit. Slide 3: the recommendation and the decision required. Add speaker notes with the key message for each slide."}, "how": {"ja": "最後のステップです。C9で作成したブリーフィングのWord文書を参照先に指定します。会社のデザインに合わせる方法は2つあります。（1）推奨：ブランドキットを使います。（2）ブランドキットがない場合：空のプレゼンテーションを開き、気に入っているプレゼンテーションを参照先に指定してそのデザインに合わせるよう依頼するか、そのプレゼンテーションのコピーを開いて作業を始めます。", "en": "This is the last step. Refer Copilot to the Word document of your briefing from C9. There are two ways to follow your corporate design. (1) Preferred: use a brand kit. (2) Otherwise: open a blank presentation, reference a presentation you like and ask Copilot to follow its design, or start from a copy of that presentation."}}], "samples": [{"name": "CCBJI Vending Sales - SAMPLE DATA.xlsx", "href": "CCBJI-Vending-Sales-SAMPLE-DATA.xlsx", "eyebrow": {"ja": "サンプルデータ（架空）", "en": "Sample data (fictional)"}, "title": {"ja": "サンプルの販売データブック", "en": "Sample sales workbook"}, "intro": {"ja": "自動販売機300台の月別販売データ（2024年1月～2026年10月）と、自動販売機、顧客、製品、地域別の気温の各シートを収めたExcelブックです。数値はすべて架空であり、CCBJIの実際の顧客、価格、業績を示すものではありません。NSRの列は純売上高、MPの列は限界利益（製品原価・手数料・決済手数料を差し引いた後の利益）です。ファイルは約4MBです。ダウンロード後、OneDriveに保存してからExcelで開いてください。", "en": "An Excel workbook with monthly sales for 300 vending machines (January 2024 to October 2026) and sheets for machines, customers, products and regional weather. Every figure is fictional and does not represent CCBJI's actual customers, prices or results. Its NSR column is net sales revenue and its MP column is marginal profit (profit after product cost, location commission and payment fees). The file is about 4 MB. After downloading, save it to OneDrive and open it in Excel."}}]}, {"id": "sharpen", "kind": "optional", "nav": {"ja": "プロンプトを磨く（任意）", "en": "Sharpen your prompts (optional)"}, "navSub": {"ja": "プロンプト コーチ", "en": "Prompt Coach"}, "title": {"ja": "プロンプトを磨く（任意）", "en": "Sharpen your prompts (optional)"}, "desc": {"ja": "どの回答もよくする二つの習慣です。プロンプト コーチと一緒にプロンプトを磨くこと、そしてCopilotの回答をそのまま受け入れず、問い直すことです。", "en": "Two habits that improve every answer: refine your prompt with Prompt Coach, and challenge Copilot's answer rather than accepting it as given."}, "skill": {"ja": "プロンプトを磨き、回答を問い直す", "en": "Refining prompts and challenging answers"}, "features": {"ja": "プロンプト コーチ、前提と根拠の確認", "en": "Prompt Coach; checking assumptions and evidence"}, "notes": [], "prompts": [{"id": "D1", "title": {"ja": "プロンプトを改善する", "en": "Improve my prompt"}, "text": {"ja": "次のプロンプトを改善してください：「[自動販売機事業の状況を教えてください]」。よりよい回答を得るための質問を、3つまで私にしてください。そのうえで、目的、背景、情報源、期待する形式を明確にして書き直してください。", "en": "Help me improve this prompt: \"[Give me an update on our vending business]\". Ask me up to three questions that would lead to a better answer. Then rewrite the prompt with a clear goal, context, source and expectations."}, "how": {"ja": "[ ] の例は、ご自身のプロンプトに置き換えられます。質問に答えたあと、書き直されたプロンプトをCopilot Chatで実行し、元のプロンプトの結果と比べてみてください。", "en": "You can replace the example in [ ] with a prompt of your own. Answer the questions, then run the rewritten prompt in Copilot Chat and compare it with the result of the original."}, "app": {"ja": "プロンプト コーチ", "en": "Prompt Coach"}}, {"id": "D2", "title": {"ja": "回答を問い直す", "en": "Challenge the answer"}, "text": {"ja": "今の回答で、どのような前提を置きましたか。根拠が最も弱いのはどの部分で、どのような情報があれば結論が変わりますか。", "en": "What assumptions did you make in that answer? Which part has the weakest support, and what information would change your conclusion?"}, "how": {"ja": "Copilotの回答は、そのまま受け入れず、問い直すことが大切です。重要な判断に使う前に、どのCopilotのどの回答にも使えます。", "en": "Do not accept an answer as given: challenge it. This works on any answer, in any Copilot, before you rely on it for an important decision."}, "app": {"ja": "Copilot Chat（どのCopilotでも可）", "en": "Copilot Chat (or any Copilot)"}}], "appsEyebrow": {"ja": "はじめる前に", "en": "Before you start"}, "appsTitle": {"ja": "各ステップで使うアプリ", "en": "Where to run each step"}, "appsIntro": {"ja": "D1はプロンプト コーチで実行します。D2は、どのCopilotでも使えます。", "en": "Run D1 in Prompt Coach. D2 works in any Copilot."}, "apps": [{"icon": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIQAAACECAYAAABRRIOnAABFxUlEQVR42u29a9Cl2VUe9jzrfc/5bt3T09KM5oIkJKQZCWQkI4Fjcx0RQAISgmM0djAx5dgEByemXCROqBTuGTtx2abKjnzBNlQBSUGCZ7gFbMVywDMILINASAhdkBhpRnfNvae/6znn3Wvlx15r7f1+PRLTDQIi+kz19NfnnO9c3r32ujzrWc8Grt2u3a7drt2u3a7drt2u3a7d/lDfDEYz4+y+U/++dvujaBgXTOweG7q7/tAYxTXr/P0yAjPifgxPnlz6joH866Y4N8jwE3KCC3vfuPcxMxOS+gf9OeXaUv0+GMM9NpC0S9PRd5y/7rrXj8PiBSTPn7lu9y+vxs3/Zm+wrQgp1wzij4JneB3U3mh7ZuUvTUV1Pa2LmtqliwfT3s7eNzzBS68kqbjnD349rhnEp/t2PwaSdrB18sWDDLcdr44JQgiyWMFyOW4tCr8CAPA6XAsZn/G3O2AAYFq++MzZ3R3VUggSBEjK8cnKCuzrzWpYuWYQn+HVBMlib7Znmdk3rNcTQJJCgABBWW/WpPBL9v+f/Zf8YShDrxnEp/N2V/3rcHP4gnGQLzhendjsmhMwmC2GBYvZ15oZcReuGcRnspMAAC346t2dXQqhJEnU/9wqbBhHGPBakoa7YNcM4jP0RtLsHhtE+M2r9QYGCKtXgOcQMDMWLYDhlU/965PbSZqZyTWD+EwsNwHsX79/e4F+XtEJBNljgQYDAWw2K93aWp43bL4GAN76/W8drhnEZ95NAEC25Bu3FltjUTW6PZCMFAIU0gxlZ2uLRaevsjfY1qvOv0r/oECqawbx6fMOZvfZtpF3LhcLGMzM0wOjwWhAjR8AMO4fHJa97b2vOVocvZx3stx/AcM1g/hMud0LIakHi+NvWiwWn394clSTSWa5CYIws8g1WKxgsVzsrDeb/w4A7rgL5ZpBfIZgD3gd1H7Fbibsfx5HGQBYzR9qoIikEgQo9W6hDJcOLtkg43956Q1HX0rS7MLvf3J5zSA+DdgDSTssx9+9t7v70qOTlZIcqgEYAOtyiM44aqjBQhYoNv2Dj7/x43u8m3rhwgW5ZhD//80dRpJ66d8ffscwDv/t0cmxCimRQVr+bTVohNNw5EFEuJpW5ezumS/amXZfDwAve9nLeOH30VNc40P83iWRQrJc/A9Hf3ZnOf6QFWxvNhvQfNWLp5VGUA2q1ShMDaaWRmEwMzM7s3NGjg4P/tH1/+n57wSswuB3f/r5EuO15fxdGYLce++9JFkAlINfOfi2re3lP7TJdjZlrUIRM62LLQYUDxL0AkOtbcv8sSafRydHurO799ee/FcX  it to respond, so that you do not need to repeat it in every chat. Then put it to work for you every week."}, "skill": {"ja": "Copilotのパーソナライズ", "en": "Personalizing Copilot"}, "features": {"ja": "カスタム指示、プロンプトのスケジュール、メモリ", "en": "Custom instructions, scheduled prompts and memory"}, "notes": [], "prompts": [{"app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "カスタム指示を設定する", "en": "Set your custom instructions"}, "text": {"ja": "私は[会社名]の[役職]です。最近のメール、ドキュメント、会議、チャットをもとに、あなたの回答が私にとってより役立つものになるような、短いカスタム指示を5つ提案してください。それぞれ、Copilotのカスタム指示にそのまま貼り付けられる一行で書いてください。", "en": "I am [your role] at [your company]. Based on my recent emails, documents, meetings and chats, suggest five short custom instructions that would make your answers more useful to me. Write each one as a single line that I can paste into my Copilot custom instructions."}, "find": {"ja": "Copilot Chatの右上にある「…」（設定など）を選び、「チャット設定」を選びます。左側のメニューで「パーソナライズ」を選び、「カスタム指示」の「指示を編集」を選びます。アプリの更新が順次進んでいるため、表示が多少異なる場合があります。", "en": "In Copilot Chat, select the three dots (Settings and more) at the top right, then Chat settings. Select Personalization in the menu on the left, then Edit instructions on the Custom instructions tile. The app is being updated, so what you see may differ slightly."}, "how": {"ja": "プロンプトを実行し、ご自身に合う提案を選びます。下の例をコピーしてもかまいません。「カスタム指示」の入力欄に一行ずつ貼り付け、「指示を保存」を選びます。保存すると、以降の新しいチャットすべてに反映されます。", "en": "Run the prompt and choose the suggestions that fit you, or copy any of the lines below. Paste them into the Custom instructions box, one per line, and select Save instructions. Copilot then follows them in every new chat."}, "link": {"url": "https://support.microsoft.com/en-us/microsoft-365-copilot/customize-how-microsoft-365-copilot-responds-to-you", "label": {"ja": "カスタム指示について詳しく見る", "en": "Learn more about custom instructions"}}, "moreLabel": {"ja": "そのまま使える指示の例", "en": "Or copy a suggestion"}, "more": [{"ja": "簡潔に回答してください。結論または提案を最初に述べ、そのあとに根拠を示してください。", "en": "Be concise. Start with the conclusion or recommendation, then the supporting facts."}, {"ja": "必ずしも私に同意する必要はありません。私が見落としている点がある場合や、根拠が別の結論を示している場合は、率直に指摘してください。", "en": "You do not always have to agree with me. Push back when I may be missing something or when the evidence points the other way."}, {"ja": "確信が持てない場合や、依頼の内容があいまいな場合は、推測で進めず、先に私に確認してください。", "en": "If you are uncertain or my request is unclear, ask me before you make assumptions."}, {"ja": "私が別の言語で書いた場合を除き、[日本語]で回答してください。", "en": "Reply in [Japanese] unless I write to you in another language."}], "id": "E1"}, {"app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "違いを確かめる", "en": "See the difference"}, "text": {"ja": "今週の最優先事項について、チーム向けの短いメッセージを下書きしてください。", "en": "Draft a short message to my team about this week's top priority."}, "how": {"ja": "保存した指示が反映されるよう、新しいチャットで実行します。回答の長さや調子がどう変わったかを確かめ、必要に応じて指示を調整してください。", "en": "Run it in a new chat so that your saved instructions apply. Notice how the length and tone have changed, and adjust your instructions if needed."}, "id": "E2"}, {"app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "週次のリーダーシップ ブリーフ", "en": "Your weekly leadership brief"}, "text": {"ja": "この1週間と今後1週間について、私のメール、Teamsのチャット、予定表をもとに、短い週次のリーダーシップ ブリーフを作成してください。\n\n次の4つに分けてください。\n1. 🎯 今週、私の判断が必要なこと\n2. 📈 大きくなりつつある、顧客・人・オペレーションの課題\n3. 📅 準備が必要な会議\n4. ✅ 任せられること、対応不要なこと\n\n各セクションは、「項目」と「重要な理由」の列を持つ短い表で示してください。緊急は 🔴、要注意は 🟠、順調は 🟢 で示してください。全体を1画面に収めてください。", "en": "Give me a short weekly leadership brief from my email, Teams chats and calendar for the last week and the week ahead.\n\nSeparate it into:\n1. 🎯 Needs my decision this week\n2. 📈 Customer, people or operations issues building\n3. 📅 Meetings to prepare for\n4. ✅ What I can delegate or ignore\n\nShow each section as a short table with Item and Why it matters. Use 🔴 for urgent, 🟠 for needs attention and 🟢 for on track. Keep the whole brief to one screen."}, "how": {"ja": "毎週実行する価値のあるプロンプトです。4つのセクションは、顧客、チャネル、地域など、ご自身の役割に合わせて変更してください。", "en": "This is the kind of prompt worth running every week. Change the four sections to fit your role, such as customers, channels or regions."}, "action": {"title": {"ja": "スケジュールを設定する", "en": "Schedule it"}, "text": {"ja": "ブリーフが役に立つことを確かめます。次に、送信したプロンプトにマウス ポインターを合わせ、「このプロンプトをスケジュール」を選び、毎週月曜日の朝に設定して保存します。", "en": "Check the brief is useful. Then hover over your prompt, select Schedule this prompt, choose Weekly on Monday morning and select Save."}, "note": {"ja": "スケジュールを設定するには、先にプロンプトを一度実行する必要があります。スケジュール機能が使えない場合は、プロンプトを保存し、毎週月曜日に実行してください。", "en": "You must run a prompt once before you can schedule it. If scheduling is unavailable, save the prompt and run it each Monday."}}, "id": "E3"}, {"id": "E4", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "私の仕事の進め方", "en": "My working style"}, "text": {"ja": "私の仕事の進め方とコミュニケーションの特徴を、最近のメール、チャット、会議の具体例とともに説明してください。依頼の切り出し方、返信の速さ、フォローの仕方など、私によく見られる傾向を挙げてください。", "en": "Describe how I work and communicate, with specific recent examples from my email, chats and meetings. Show what I tend to do, such as how I open a request, how quickly I reply and how I follow up."}, "how": {"ja": "Copilotが、ご自身のメール、チャット、会議から仕事の進め方をどう読み取っているかを確認できます。", "en": "See how Copilot reads your working habits from your own email, chats and meetings."}}, {"app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "optional": true, "title": {"ja": "Copilotが覚えていることを確かめる", "en": "Check what Copilot remembers"}, "text": {"ja": "私について、また私の仕事の進め方について、何を覚えていますか。", "en": "What do you remember about me and how I like to work?"}, "how": {"ja": "メモリ：Copilotは、あなたが伝えた事実を覚えておくことができます。追加するには、「…を覚えておいてください」と伝えます。変更または削除するには、「チャット設定」の「パーソナライズ」を開きます。", "en": "Memory: Copilot can remember facts you share. To add one, say \"Remember that ...\". To change or delete memories, go to Chat settings, then Personalization."}, "id": "E5"}]}]}</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var EX=D.exercises,UI=D.ui,M=D.meta,N=EX.length-1;
  function get(k,d){try{var v=localStorage.getItem('ccbji-pp-'+k);return v===null?d:v}catch(e){return d}}
  function set(k,v){try{localStorage.setItem('ccbji-pp-'+k,v)}catch(e){}}
  var lang=get('lang','ja');if(lang!=='ja'&&lang!=='en')lang='ja';
  var theme=get('theme','light');if(theme!=='light'&&theme!=='dark')theme='light';
  var cur=0;var h=(location.hash||'').replace('#','');
  EX.forEach(function(e,i){if(e.id===h)cur=i});
  function t(o){return o?(o[lang]||o.ja||''):''}
  function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined&&txt!==null)n.textContent=txt;return n}
  function $(id){return document.getElementById(id)}
  var toastTimer;
  function toast(msg){var x=$('toast');x.textContent=msg;x.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){x.classList.remove('on')},1800)}
  function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}document.body.removeChild(ta);return ok}
  function copy(text,btn){
    function good(){btn.textContent=t(UI.copied);toast(t(UI.copied));setTimeout(function(){btn.textContent=t(UI.copy)},1600)}
    function bad(){toast(t(UI.copyFail))}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(good,function(){fallbackCopy(text)?good():bad()})}
    else{fallbackCopy(text)?good():bad()}
  }
  function download(f){try{if(f.href){var direct=function(){var a0=document.createElement('a');a0.href=f.href;a0.setAttribute('download',f.name);document.body.appendChild(a0);a0.click();a0.remove()};if(!window.fetch){direct();return}fetch(f.href,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http');return r.arrayBuffer()}).then(function(buf){var bl=new Blob([buf],{type:'application/octet-stream'});var u2=URL.createObjectURL(bl);var a1=document.createElement('a');a1.href=u2;a1.setAttribute('download',f.name);document.body.appendChild(a1);a1.click();a1.remove();setTimeout(function(){URL.revokeObjectURL(u2)},4000)}).catch(direct);return}var bin=atob(f.b64),n=bin.length,u=new Uint8Array(n);for(var k=0;k<n;k++)u[k]=bin.charCodeAt(k);
    var blob=new Blob([u],{type:/\.docx$/.test(f.name)?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=f.name;a.style.display='none';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},4000)}catch(err){toast(t(UI.copyFail))}}
  function go(i){cur=Math.max(0,Math.min(N,i));try{history.replaceState(null,'','#'+EX[cur].id)}catch(e){}render();$('scroll').scrollTop=0;window.scrollTo(0,0)}
  function renderNav(){
    var nav=$('nav');nav.textContent='';
    EX.forEach(function(e,i){
      var b=el('button');b.type='button';if(i===cur)b.setAttribute('aria-current','true');
      b.appendChild(el('span','num',String(i)));
      var w=el('span');w.appendChild(el('div','nt',t(e.nav)));w.appendChild(el('div','ns',t(e.navSub)));b.appendChild(w);
      b.addEventListener('click',function(){go(i)});nav.appendChild(b);
    });
  }
  function section(e,i){
    var s=el('section','ex'+(i===cur?' active':''));
    var hero=el('div','hero');var hl=el('div');
    var label=i===0?t(UI.kinds.start):t(UI.activity)+' '+i+' · '+t(UI.kinds[e.kind]);
    hl.appendChild(el('div','kick caps',label));
    hl.appendChild(el('h2',null,t(e.title)));
    hl.appendChild(el('p',null,t(e.desc)));
    hero.appendChild(hl);
    var sk=el('div','skill');sk.appendChild(el('div','caps',t(UI.skill)));sk.appendChild(el('div','v',t(e.skill)));sk.appendChild(el('div','f',t(e.features)));hero.appendChild(sk);
    s.appendChild(hero);
    if(e.notes&&e.notes.length){var ul=el('ul','notes');e.notes.forEach(function(n){ul.appendChild(el('li',null,t(n)))});s.appendChild(ul)}
    if(e.apps){var pa=el('div','panel');pa.appendChild(el('div','caps',t(e.appsEyebrow)));pa.appendChild(el('h3',null,t(e.appsTitle)));pa.appendChild(el('p',null,t(e.appsIntro)));
      var ag=el('div','ings');e.apps.forEach(function(c){var x=el('div','ing');if(c.icon){var im=el('img','appicon');im.src=c.icon;im.alt='';im.width=44;im.height=44;x.appendChild(im)}x.appendChild(el('h4',null,t(c.t)));x.appendChild(el('div','q',t(c.q)));x.appendChild(el('p',null,t(c.d)));ag.appendChild(x)});pa.appendChild(ag);s.appendChild(pa)}
    (e.samples||(e.sample?[e.sample]:[])).forEach(function(sm){var ps=el('div','panel');ps.appendChild(el('div','caps',t(sm.eyebrow)));ps.appendChild(el('h3',null,t(sm.title)));ps.appendChild(el('p',null,t(sm.intro)));
      var db=el('button','copy dl',t(UI.download));db.type='button';db.addEventListener('click',function(){download(sm)});ps.appendChild(db);ps.appendChild(el('div','fname',sm.name));s.appendChild(ps)})
    if(e.video){var pv2=el('div','panel');pv2.appendChild(el('div','caps',t(e.video.eyebrow)));pv2.appendChild(el('h3',null,t(e.video.title)));pv2.appendChild(el('p',null,t(e.video.intro)));
      var vd=el('video','vid');vd.controls=true;vd.preload='metadata';vd.setAttribute('playsinline','');vd.setAttribute('aria-label',t(e.video.title));
      var fb=el('p','vfall',t(e.video.fallback));fb.style.display='none';
      vd.addEventListener('error',function(){vd.style.display='none';fb.style.display='block'});vd.src=e.video.file;
      pv2.appendChild(vd);pv2.appendChild(fb);s.appendChild(pv2)}
    if(e.cards){var g=el('div','grid3');e.cards.forEach(function(c,k){var cd=el('div','card');cd.appendChild(el('div','n',String(k+1)));cd.appendChild(el('h4',null,t(c.t)));cd.appendChild(el('p',null,t(c.d)));g.appendChild(cd)});s.appendChild(g)}
    if(e.flow){var p1=el('div','panel');p1.appendChild(el('div','caps',t(e.flowTitle)));p1.appendChild(el('h3',null,t(e.flowHead)));p1.appendChild(el('p',null,t(e.flowIntro)));
      var st=el('div','steps');e.flow.forEach(function(c,k){var x=el('div','step');var cc=el('div','c');cc.appendChild(el('b',null,'0'+(k+1)));cc.appendChild(el('i'));x.appendChild(cc);x.appendChild(el('h4',null,t(c.t)));x.appendChild(el('p',null,t(c.d)));st.appendChild(x)});p1.appendChild(st);s.appendChild(p1)}
    if(e.mindset){var pm=el('div','panel');pm.appendChild(el('div','caps',t(e.mindset.eyebrow)));pm.appendChild(el('h3',null,t(e.mindset.title)));pm.appendChild(el('p',null,t(e.mindset.intro)));var mg=el('div','mind');e.mindset.items.forEach(function(c){var x=el('div','mindc');var mi=el('img','mindi');mi.src=c.icon;mi.alt='';mi.width=420;mi.height=420;x.appendChild(mi);x.appendChild(el('h4',null,t(c.t)));x.appendChild(el('p',null,t(c.d)));mg.appendChild(x)});pm.appendChild(mg);s.appendChild(pm)}
    if(e.ing){var p2=el('div','panel');p2.appendChild(el('div','caps',t(e.ingEyebrow)));p2.appendChild(el('h3',null,t(e.ingTitle)));p2.appendChild(el('p',null,t(e.ingIntro)));
      var ig=el('div','ings');e.ing.forEach(function(c,k){var x=el('div','ing'+(e.example?' kc k'+k:''));x.appendChild(el('h4',null,t(c.t)));x.appendChild(el('div','q',t(c.q)));x.appendChild(el('p',null,t(c.d)));if(e.example&&e.example.parts[k]){x.appendChild(el('div','exl',t(UI.phrase)));x.appendChild(el('div','exv',t(e.example.parts[k].t)))}ig.appendChild(x)});p2.appendChild(ig);if(e.example){var xw=el('div','exm');var xh=el('div','exmh');xh.appendChild(el('div','moreh',t(e.example.head)));var xb=el('button','copy',t(UI.copy));xb.type='button';xb.setAttribute('aria-label',t(UI.copy)+': '+t(e.example.head));xb.addEventListener('click',function(){copy(t(e.example.text),xb)});xh.appendChild(xb);xw.appendChild(xh);var xp=el('p','exmp');e.example.parts.forEach(function(pp,k){if(k&&lang==='en')xp.appendChild(document.createTextNode(' '));var sp=el('span','k'+k,t(pp.t));sp.title=t(pp.k);xp.appendChild(sp)});xw.appendChild(xp);if(e.example.how){var xhw=el('p','how');xhw.appendChild(el('b',null,t(UI.how)));xhw.appendChild(document.createTextNode(t(e.example.how)));xw.appendChild(xhw)}p2.appendChild(xw)}p2.appendChild(el('div','remember',t(e.remember)));s.appendChild(p2)}
    if(e.before){var pb0=el('div','panel');pb0.appendChild(el('div','caps',t(e.before.eyebrow)));pb0.appendChild(el('h3',null,t(e.before.title)));pb0.appendChild(el('p',null,t(e.before.intro)));var bg=el('div','bws');e.before.cols.forEach(function(c){var x=el('div','bw');if(c.img){var bh=el('div','bwh'+(c.imgLogo?' logo':''));var bim=el('img');bim.src=c.img;bim.alt=t(c.imgAlt);bh.appendChild(bim);x.appendChild(bh)}else if(c.icon){var bi=el('img','bwi');bi.src=c.icon;bi.alt='';bi.width=40;bi.height=40;x.appendChild(bi)}x.appendChild(el('h4',null,t(c.t)));var ol=el('ol');c.steps.forEach(function(q){ol.appendChild(el('li',null,t(q)))});x.appendChild(ol);if(c.note)x.appendChild(el('p','bwn',t(c.note)));if(c.link){var oa=el('a','open',t(c.link.label));oa.href=c.link.url;oa.target='_blank';oa.rel='noopener noreferrer';x.appendChild(oa)}bg.appendChild(x)});pb0.appendChild(bg);if(e.before.tip){var bt=el('div','bwt');bt.appendChild(el('b',null,t(e.before.tip.t)));bt.appendChild(document.createTextNode(t(e.before.tip.d)));pb0.appendChild(bt)}s.appendChild(pb0)}
    if(e.site){var ps0=el('div','panel site');ps0.appendChild(el('h3',null,t(e.site.title)));var so=el('ol');e.site.steps.forEach(function(q){so.appendChild(el('li',null,t(q)))});ps0.appendChild(so);s.appendChild(ps0)}
    if(e.prompts&&e.prompts.length){
      var sh=el('div','sechead');sh.appendChild(el('h3',null,t(UI.prompts)));sh.appendChild(el('span',null,t(UI.count).replace('{n}',e.prompts.length)));s.appendChild(sh);
      e.prompts.forEach(function(p){
        var pc=el('div','prompt');var ph=el('div','ph');
        var left=el('div');var pidr=el('div','pid',p.id);if(p.optional){pidr.appendChild(el('span','opt',t(UI.optional)))}left.appendChild(pidr);left.appendChild(el('div','pt',t(p.title)));if(p.app){left.appendChild(el('div','pa',t(p.app)))}ph.appendChild(left);
        if(p.view){ph.appendChild(el('span','view',t(UI.viewOnly)))}
        else{var cb=el('button','copy',t(UI.copy));cb.type='button';cb.setAttribute('aria-label',t(UI.copy)+' '+p.id+': '+t(p.title));cb.addEventListener('click',function(){copy(t(p.text),cb)});ph.appendChild(cb)}
        pc.appendChild(ph);var pb=el('div','pb');pb.appendChild(el('p','ptext',t(p.text)));
        if(p.find){var fw=el('p','how find');fw.appendChild(el('b',null,t(UI.find)));fw.appendChild(document.createTextNode(t(p.find)));pb.appendChild(fw)}var hw=el('p','how');hw.appendChild(el('b',null,t(UI.how)));hw.appendChild(document.createTextNode(t(p.how)));if(p.link){hw.appendChild(document.createTextNode(' '));var lk=el('a','lnk',t(p.link.label));lk.href=p.link.url;if(p.link.download){lk.setAttribute('download',p.link.download)}else{lk.target='_blank';lk.rel='noopener noreferrer'}hw.appendChild(lk)}pb.appendChild(hw);if(p.action){var aw=el('div','act');aw.appendChild(el('div','acth',t(UI.action)));aw.appendChild(el('div','actt',t(p.action.title)));aw.appendChild(el('p','actx',t(p.action.text)));if(p.action.note){aw.appendChild(el('p','actn',t(p.action.note)))}pb.appendChild(aw)}if(p.more){var mw=el('div','more');mw.appendChild(el('div','moreh',t(p.moreLabel||UI.more)));p.more.forEach(function(mt){var r=el('div','morer');r.appendChild(el('span','moret',t(mt)));var mb=el('button','copy',t(UI.copy));mb.type='button';mb.setAttribute('aria-label',t(UI.copy)+': '+t(mt));mb.addEventListener('click',function(){copy(t(mt),mb)});r.appendChild(mb);mw.appendChild(r)});if(p.moreNote){mw.appendChild(el('div','moren',t(p.moreNote)))}pb.appendChild(mw)}pc.appendChild(pb);
        s.appendChild(pc);
      });
    }
    var pg=el('div','pager');
    var pv=el('button','pg','← '+t(UI.prev));pv.type='button';if(i===0)pv.disabled=true;pv.addEventListener('click',function(){go(i-1)});
    var nx=el('button','pg nextb',(i===0?t(UI.begin):t(UI.next))+' →');nx.type='button';if(i===N)nx.disabled=true;nx.addEventListener('click',function(){go(i+1)});
    pg.appendChild(pv);pg.appendChild(nx);s.appendChild(pg);
    return s;
  }
  function render(){
    document.documentElement.lang=lang;document.documentElement.setAttribute('data-theme',theme);
    document.title=t(EX[cur].nav)+' | CCBJI '+t(M.brand);
    $('eyebrow').textContent=t(M.eyebrow);$('brand').textContent=t(M.brand);$('choose').textContent=t(UI.choose);
    $('countAll').textContent=t(UI.countAll).replace('{n}',N);
    $('guide').textContent=t(M.guide);$('guideSub').textContent=t(M.guideSub);
    $('btnLang').textContent=t(UI.lang);$('btnTheme').textContent=t(UI.theme);$('btnPrint').textContent=t(UI.print);
    $('progText').textContent=cur===0?t(UI.kinds.start):t(UI.of).replace('{i}',cur).replace('{n}',N);
    $('fill').style.inlineSize=(cur/N*100)+'%';
    var tr=$('track');tr.setAttribute('aria-valuemax',N);tr.setAttribute('aria-valuenow',cur);
    $('fFict').textContent=t(UI.fictional);$('fNote').textContent=t(UI.footer);
    $('fVer').textContent=t(UI.version)+' '+M.version+' · '+t(M.date);
    renderNav();
    var st=$('stage');st.textContent='';EX.forEach(function(e,i){st.appendChild(section(e,i))});
  }
  $('btnLang').addEventListener('click',function(){lang=lang==='ja'?'en':'ja';set('lang',lang);render()});
  $('btnTheme').addEventListener('click',function(){theme=theme==='dark'?'light':'dark';set('theme',theme);render()});
  $('btnPrint').addEventListener('click',function(){window.print()});
  document.addEventListener('keydown',function(ev){if(ev.altKey&&ev.key==='ArrowRight')go(cur+1);if(ev.altKey&&ev.key==='ArrowLeft')go(cur-1)});
  render();
})();
