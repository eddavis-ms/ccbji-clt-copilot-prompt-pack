<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>CCBJI Copilot プロンプトパック</title>
<style>
:root{--side:#ffffff;--bg:#f1efed;--bar:#ffffff;--surface:#ffffff;--inset:#f6f4f2;--ink:#1c1b1a;--muted:#5f5b58;--line:#dedad6;--accent:#d91e2a;--accent-ink:#ffffff;--track:#d5d0cc;--active:#f3eeeb;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark){:root{--side:#232222;--bg:#3b3a39;--bar:#2b2a2a;--surface:#2b2a2a;--inset:#343332;--ink:#f1efed;--muted:#aaa6a2;--line:#444241;--accent:#f0474f;--accent-ink:#ffffff;--track:#5a5857;--active:#353433;--shadow:0 2px 10px rgba(0,0,0,.25)}}
:root[data-theme="light"]{--side:#ffffff;--bg:#f1efed;--bar:#ffffff;--surface:#ffffff;--inset:#f6f4f2;--ink:#1c1b1a;--muted:#5f5b58;--line:#dedad6;--accent:#d91e2a;--accent-ink:#ffffff;--track:#d5d0cc;--active:#f3eeeb;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06)}
:root[data-theme="dark"]{--side:#232222;--bg:#3b3a39;--bar:#2b2a2a;--surface:#2b2a2a;--inset:#343332;--ink:#f1efed;--muted:#aaa6a2;--line:#444241;--accent:#f0474f;--accent-ink:#ffffff;--track:#5a5857;--active:#353433;--shadow:0 2px 10px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans JP",Meiryo,system-ui,sans-serif;font-size:16px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.caps{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.app{display:grid;grid-template-columns:340px minmax(0,1fr);height:100vh}
.side{background:var(--side);display:flex;flex-direction:column;min-height:0;border-inline-end:1px solid var(--line)}
.sidehead{display:flex;gap:16px;align-items:center;padding:26px 24px 24px;border-block-end:1px solid var(--line)}
.logo{inline-size:84px;flex:none;display:block}
.logo svg{display:block;inline-size:100%;block-size:auto}
.logo span{display:block;text-align:center;font-size:8px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-block-start:3px;white-space:nowrap}
.sidehead .caps{color:var(--muted)}
.brand{font-size:19px;font-weight:600;line-height:1.3;margin-block-start:2px}
.choose{padding:22px 24px 8px;color:var(--muted)}
.nav{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:4px}
.nav button{display:grid;grid-template-columns:30px 1fr;column-gap:12px;align-items:start;text-align:start;background:none;border:1px solid transparent;border-radius:12px;padding:12px 12px 13px}
.nav button:hover{background:var(--active)}
.nav button[aria-current="true"]{background:var(--active);border-color:var(--line)}
.num{inline-size:30px;block-size:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.nt{font-size:15px;font-weight:700;line-height:1.4;padding-block-start:2px}
.ns{font-size:12.5px;color:var(--muted);line-height:1.4;margin-block-start:6px}
.sidefoot{padding:14px 24px;border-block-start:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
.dot{inline-size:7px;block-size:7px;border-radius:50%;background:var(--accent);flex:none}
.right{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{background:var(--bar);border-block-end:1px solid var(--line);padding:14px 40px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar h1{font-size:15px;margin:0;line-height:1.4}
.bar p{margin:0;color:var(--muted);font-size:12.5px}
.barright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.track{inline-size:110px;block-size:5px;border-radius:99px;background:var(--track);overflow:hidden}
.fill{block-size:100%;background:var(--accent);border-radius:99px;transition:inline-size .25s}
.tool{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.tool:hover{border-color:var(--accent);color:var(--ink)}
.scroll{flex:1;min-height:0;overflow-y:auto}
.main{padding:44px 40px 56px;max-inline-size:1000px}
section.ex{display:none}
section.ex.active{display:block}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:32px;align-items:start}
.kick{display:flex;align-items:center;gap:10px;color:var(--accent)}
.kick::before{content:"";inline-size:28px;block-size:3px;background:var(--accent);border-radius:2px}
.hero h2{font-size:clamp(28px,3.6vw,42px);line-height:1.25;margin:12px 0 16px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted);font-size:17px;line-height:1.75}
.skill{background:var(--surface);border:1px solid var(--line);border-block-start:3px solid var(--accent);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.skill .caps{color:var(--muted);font-size:11px}
.skill .v{font-weight:700;font-size:16px;margin:8px 0 10px;line-height:1.4}
.skill .f{font-size:13.5px;color:var(--muted);line-height:1.6}
.notes{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.notes li{font-size:14px;padding:11px 16px;border-inline-start:3px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0;color:var(--muted)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:38px 0 14px}
.sechead h3{font-size:17px;margin:0}
.sechead span{font-size:13px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-block-start:34px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.card .n{inline-size:30px;block-size:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.card h4{margin:14px 0 8px;font-size:17px;line-height:1.4}
.card p{margin:0;font-size:14.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:var(--shadow);margin-block-start:28px}
.panel .caps{color:var(--accent)}
.panel h3{font-size:24px;line-height:1.35;margin:8px 0 10px}
.panel>p{margin:0;color:var(--muted);font-size:15.5px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px;margin-block-start:30px}
.step .c{display:flex;align-items:center;gap:0}
.step .c b{inline-size:36px;block-size:36px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:12px;flex:none}
.step .c i{flex:1;block-size:2px;background:var(--track);margin-inline-start:8px}
.step h4{margin:16px 0 6px;font-size:16px;line-height:1.4}
.step p{margin:0;font-size:14px;color:var(--muted)}
.ings{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-block-start:26px}
.ing{background:var(--inset);border-radius:12px;padding:18px}
.ing h4{margin:0 0 6px;font-size:16px;color:var(--accent)}
.ing .q{font-size:14.5px;font-weight:700;margin-block-end:6px}
.ing p{margin:0;font-size:14px;color:var(--muted)}
.vid{display:block;inline-size:100%;max-block-size:70vh;background:#000;border-radius:12px;margin-block-start:22px}.vfall{margin-block-start:22px!important;padding:16px 18px;border:1px dashed var(--line);border-radius:12px;background:var(--inset)}.dl{margin-block-start:22px;font-size:14px;padding:11px 18px}.fname{margin-block-start:10px;font-size:12.5px;color:var(--muted)}
.appicon{display:block;inline-size:44px;block-size:44px;object-fit:contain;margin-block-end:12px}
.remember{margin-block-start:20px;padding:14px 18px;border-radius:12px;background:var(--inset);font-size:14.5px;border-inline-start:3px solid var(--accent)}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-block-end:18px;overflow:hidden}
.ph{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding:20px 22px 18px;border-block-end:1px solid var(--line)}
.pid{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.04em}
.pt{font-weight:700;font-size:17px;line-height:1.45;margin-block-start:2px}
.pa{font-size:13px;color:var(--muted);margin-block-start:4px}
.copy{background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:8px 18px;font-size:13px;font-weight:700;flex:none;white-space:nowrap}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.view{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--inset);border:1px dashed var(--line);border-radius:12px;padding:7px 12px;flex:none;max-inline-size:280px;line-height:1.4;text-align:center}
.pb{padding:20px 22px 22px}
.ptext{margin:0;white-space:pre-wrap;font-size:16px;line-height:1.85}
.how{margin:18px 0 0;font-size:13.5px;color:var(--muted);background:var(--inset);border-radius:10px;padding:11px 16px}
.more{margin:16px 0 0;border-top:1px dashed var(--line);padding-top:14px}.moreh{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.04em;margin-bottom:8px}.morer{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 0}.moret{font-size:14.5px;line-height:1.7}.moren{font-size:13px;color:var(--muted);margin-top:6px}
.how a.lnk{color:var(--accent);font-weight:600;text-decoration:underline;white-space:nowrap}
.how b{color:var(--accent);margin-inline-end:10px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-block-start:30px}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 20px;font-size:14px;font-weight:700}
.pg:hover{border-color:var(--accent)}
.pg[disabled]{opacity:.35;cursor:default}
.pg.nextb{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
footer{margin-block-start:40px;padding-block-start:16px;border-block-start:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer p{margin:0 0 4px}
.toast{position:fixed;inset-block-end:24px;inset-inline:0;margin-inline:auto;inline-size:max-content;max-inline-size:90vw;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:1100px){.app{grid-template-columns:270px minmax(0,1fr)}.sidehead{padding:20px 16px;gap:12px}.logo{inline-size:64px}.brand{font-size:16px}.choose{padding-inline:16px}.nav{padding-inline:8px}.sidefoot{padding-inline:16px}.bar{padding-inline:24px}.main{padding:32px 24px 48px}.hero{grid-template-columns:1fr}}
@media (max-width:640px){.app{grid-template-columns:1fr;height:auto}.side{border-inline-end:none;border-block-end:1px solid var(--line)}.nav{max-block-size:230px}.scroll{overflow:visible}.right{min-height:auto}}
@media print{.side,.barright,.pager,.copy,.toast{display:none}.app{display:block;height:auto}.scroll{overflow:visible}section.ex{display:block;break-before:page}section.ex:first-of-type{break-before:auto}.card,.prompt,.panel,.skill{box-shadow:none;break-inside:avoid}.main{padding:16px 0;max-inline-size:none}}

.side{border-inline-end:1px solid var(--line)}
.sidehead{position:relative;flex-direction:column;align-items:flex-start;gap:16px;border:0;padding:26px 24px 40px;color:#fff;background:var(--b-down) bottom/100% 18px no-repeat,linear-gradient(var(--red),var(--red)) top/100% calc(100% - 17px) no-repeat}
.sidehead .caps{color:rgba(255,255,255,.9)}
.sidehead .brand{color:#fff}
.logo{inline-size:176px;padding:20px 26px 16px;background:var(--b-box) center/100% 100% no-repeat}
.logo span{color:#55504c}
.choose{padding-block-start:14px}
.sidefoot{border:0;color:#fff;padding:26px 24px 12px;background:var(--b-up) top/100% 18px no-repeat,linear-gradient(var(--red),var(--red)) bottom/100% calc(100% - 17px) no-repeat}
.sidefoot .dot{background:#fff}
.right::after{content:"";flex:none;block-size:34px;background:var(--b-up) top/100% 18px no-repeat,linear-gradient(var(--red),var(--red)) bottom/100% calc(100% - 17px) no-repeat}
.bar h1{color:var(--accent)}
.hero h2{color:var(--accent);padding-block-end:14px;background:var(--b-stroke) left bottom/220px 9px no-repeat}
.kick::before{inline-size:44px;block-size:8px;border-radius:0;background:var(--b-stroke) center/100% 100% no-repeat}
.copy{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.copy:hover{color:var(--accent-ink);filter:brightness(.9)}
.card{border-block-start:3px solid var(--accent)}
@media (max-width:1100px){.sidehead{padding:20px 16px 36px}.logo{inline-size:150px}}
@media print{.right::after{display:none}}

 "en": "Start"}, "demo": {"ja": "デモを見る", "en": "Watch"}, "try": {"ja": "やってみる", "en": "Try it"}, "optional": {"ja": "任意", "en": "Optional"}, "next": {"ja": "今後の展望", "en": "What's next"}}, "legend": {"ja": "「デモを見る」は講師が実演する内容です。あとでご自身でも試せます。「やってみる」は皆さまご自身の業務データで実行します。", "en": "\"Watch\" items are demonstrated by the presenters and can be retried later. \"Try it\" items run on your own work data."}, "download": {"ja": "サンプルファイルをダウンロード", "en": "Download the sample file"}, "more": {"ja": "続けて試す", "en": "Try next"}}, "exercises": [{"id": "start", "kind": "start", "nav": {"ja": "はじめに", "en": "Start here"}, "navSub": {"ja": "プロンプトの基本", "en": "Prompting foundations"}, "title": {"ja": "はじめに：リーダーの一週間をCopilotとともに", "en": "Start here: a leader's week with Copilot"}, "desc": {"ja": "本日は、リーダーの一週間に沿って進めます。Copilotがご自身の仕事と組織をどう捉えているかを知り、今週の優先事項を整理し、販売データを問い直して意思決定につなげます。", "en": "Today follows a leader's week. You will see how Copilot understands your work and your organization, set your priorities for the week, and question the sales data and turn it into a decision."}, "skill": {"ja": "プロンプトの基本", "en": "Prompting foundations"}, "features": {"ja": "目的・背景・情報源・期待する形式、対話による改善、リーダーの判断", "en": "Goal, context, source and expectations; iteration; executive judgment"}, "cards": [{"t": {"ja": "実際の優先事項から始める", "en": "Start from your real priorities"}, "d": {"ja": "すでに予定されている意思決定に向けて、準備、調査、分析、伝達にCopilotを活用します。", "en": "Use Copilot on the decisions already on your agenda: to prepare, research, analyze and communicate."}}, {"t": {"ja": "見て、試す", "en": "Watch, then try"}, "d": {"ja": "各アクティビティは短いデモから始まります。そのあと、ご自身のメール、会議、ファイルでお試しいただきます。", "en": "Each activity opens with a short demonstration. You then try it on your own email, meetings and files."}}, {"t": {"ja": "準備はCopilot、判断はリーダー", "en": "Copilot prepares; you decide"}, "d": {"ja": "Copilotは選択肢と根拠を用意します。価格、販促、お客様に関する判断は、リーダーが行います。", "en": "Copilot brings the options and the evidence. Decisions on price, promotion and customers remain yours."}}], "flowTitle": {"ja": "本日の流れ", "en": "What the day looks like"}, "flowHead": {"ja": "リーダーの一週間を、3つのステップで", "en": "Three steps through a leader's week"}, "flowIntro": {"ja": "基本を押さえ、実際の業務で試しながら、Copilotがリーダーの判断をどう支えるかを段階的に体験します。", "en": "We start with the essentials, practice on your real work, and build up to how Copilot supports a leader's judgment."}, "flow": [{"t": {"ja": "理解する", "en": "Understand"}, "d": {"ja": "Copilotがご自身の仕事と組織をどう捉えているかを確かめます。", "en": "See how Copilot understands your work and your organization."}}, {"t": {"ja": "優先順位をつける", "en": "Prioritize"}, "d": {"ja": "今週、対応が必要なことを整理します。", "en": "Sort out what needs your attention this week."}}, {"t": {"ja": "判断する", "en": "Decide"}, "d": {"ja": "販売データを問い直し、意思決定資料にまとめます。", "en": "Question the sales data and turn it into a decision paper."}}], "ingEyebrow": {"ja": "プロンプトの基本", "en": "The art and science of prompting"}, "ingTitle": {"ja": "よいプロンプトの4つの要素", "en": "Four ingredients of a useful prompt"}, "ingIntro": {"ja": "完璧なプロンプトは必要ありません。まず得たい結果を伝え、必要に応じて次の要素を加えてください。", "en": "You do not need a perfect prompt. Start with the outcome you want, then add these as needed."}, "ing": [{"t": {"ja": "目的", "en": "Goal"}, "q": {"ja": "Copilotに何をしてほしいですか。", "en": "What do you want Copilot to do?"}, "d": {"ja": "要約、比較、分析、下書き、提案など、依頼内容を明確にします。", "en": "State the task clearly: summarize, compare, analyze, draft or recommend."}}, {"t": {"ja": "背景", "en": "Context"}, "q": {"ja": "なぜ必要で、誰が関係しますか。", "en": "Why do you need it, and who is involved?"}, "d": {"ja": "相手、事業の状況、優先事項、制約、準備している判断を伝えます。", "en": "Add the audience, business situation, priorities, constraints and the decision being prepared."}}, {"t": {"ja": "情報源", "en": "Source"}, "q": {"ja": "どの情報を使うべきですか。", "en": "Which information should Copilot use?"}, "d": {"ja": "対象の文書、ブック、メール、会議、またはWebを指定します。", "en": "Point to the document, workbook, email thread, meeting or the web."}}, {"t": {"ja": "期待する形式", "en": "Expectations"}, "q": {"ja": "どのように答えてほしいですか。", "en": "How should Copilot respond?"}, "d": {"ja": "形式、詳しさ、トーン、根拠の示し方を指定します。", "en": "Define the format, level of detail, tone and evidence you expect."}}], "remember": {"ja": "プロンプトは対話です。最初の回答を確認し、前提を問い直し、足りない情報を補って、改善を依頼してください。", "en": "Prompting is a conversation. Review the first answer, question its assumptions, add what is missing, and ask Copilot to improve it."}, "prompts": [], "notes": []}, {"id": "workiq", "kind": "try", "nav": {"ja": "ビジネスを理解するCopilot", "en": "Copilot understands your business"}, "navSub": {"ja": "Work IQ", "en": "Work IQ"}, "title": {"ja": "ビジネスを理解するCopilot", "en": "Copilot understands your business"}, "desc": {"ja": "Copilotは、ご自身のメール、会議、チャット、ファイルに加えて、組織全体で共有されている資料、会議、やり取り、人のつながりも踏まえて、出典を示しながら回答します。参照するのは、ご自身にアクセス権のある情報だけです。この力をWork IQと呼びます。まず、Copilotがご自身の仕事と組織をどこまで理解しているかを確かめてみましょう。", "en": "Copilot answers from your own work (your email, meetings, chats and files) and from your organization's shared knowledge: its documents, meetings, conversations and the way people work together. It uses only what you already have permission to see, and it always shows its sources. This ability is called Work IQ. Start by seeing how well Copilot already understands your work and your organization."}, "skill": {"ja": "Work IQを体感する", "en": "Experiencing Work IQ"}, "features": {"ja": "個人と組織の両方の文脈、アクセス権の尊重、出典の表示", "en": "Personal and organizational context; your permissions respected; sources cited"}, "notes": [{"ja": "Copilotが参照するのは、ご自身にアクセス権のある情報だけです。回答は、ご自身にしか表示されません。", "en": "Copilot uses only information you already have permission to access, and only you can see your answers."}, {"ja": "まず講師のデモをご覧いただき、そのあとご自身のCopilotでお試しください。", "en": "Watch the demonstration first, then try it in your own Copilot."}, {"ja": "A1からA4は、同じ会話の中で続けて実行してください。", "en": "Run A1 to A4 in one conversation."}], "prompts": [{"id": "A1", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "私の組織で起きていること", "en": "What is happening across my organization"}, "text": {"ja": "私がアクセスできる情報をもとに、私の組織全体で今起きていることを教えてください。各チームが最も時間を割いているテーマ、チーム間で見解が分かれている点、決定が止まっている案件を挙げ、それぞれ出典を示してください。", "en": "Based on what I have access to, what is happening across my organization right now? Show the themes my teams are spending most time on, where teams see things differently, and which decisions are stalled. Cite the source for each point."}, "how": {"ja": "まず、事業と組織全体の動きから始めます。回答の範囲は、ご自身のアクセス権によって決まります。", "en": "Start with the view across your business. What Copilot can draw on depends on your permissions."}}, {"id": "A2", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "私の仕事について知っていること", "en": "What Copilot knows about my work"}, "text": {"ja": "私の仕事について、あなたが理解していることを教えてください。私の役割、現在の優先事項、よく一緒に仕事をする相手、この1か月の時間の使い方をまとめてください。", "en": "What do you know about my work? Summarize my role, my current priorities, the people I work with most, and where my time has gone over the past month."}, "how": {"ja": "組織全体から、ご自身の仕事へと視点を移します。出典のリンクを開くと、それぞれの根拠を確認できます。", "en": "Now narrow the view from your organization to your own work. Open the source links to see what each point is based on."}}, {"id": "A3", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "私の仕事の進め方", "en": "My working style"}, "text": {"ja": "私の仕事の進め方とコミュニケーションの特徴を、最近のメール、チャット、会議の具体例とともに説明してください。依頼の切り出し方、返信の速さ、フォローの仕方など、私によく見られる傾向を挙げ、それぞれ出典を示してください。", "en": "Describe how I work and communicate, with specific recent examples from my email, chats and meetings. Show what I tend to do, such as how I open a request, how quickly I reply and how I follow up, and cite the source for each example."}, "how": {"ja": "同じ会話の中で続けます。", "en": "Continue in the same conversation."}}, {"id": "A4", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "私が見落としているかもしれないこと", "en": "What I might be missing"}, "text": {"ja": "私が見落としているかもしれないことは何ですか。率直に指摘してください。この1か月のメール、チャット、会議をもとに、私が約束したままフォローできていないこと、返信を待たせている依頼、私の判断を待っている案件、優先事項に挙げながら十分に時間を割けていないテーマを挙げ、それぞれ出典を示してください。", "en": "What might I be missing? Be candid. From my email, chats and meetings over the past month, list the commitments I made that have no follow-up yet, the requests still waiting for my reply, the decisions waiting on me, and the priorities I named that have had little of my time. Cite the source for each point."}, "how": {"ja": "Copilotは、未完了の約束や未返信の依頼など、記録から確認できる事実を示します。人を評価したり、周囲からの見られ方を推測したりはしません。気になった点は、「もう少し詳しく」「来週から何を変えるべきか」と続けて尋ねてください。", "en": "Copilot reports what the record shows, such as open commitments and unanswered requests. It does not evaluate people or guess how others see you. Follow up on any point: \"Tell me more\" or \"What should I change next week?\""}}]}, {"id": "week", "kind": "try", "nav": {"ja": "今週の優先順位をつける", "en": "Prioritize your week"}, "navSub": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "今週の優先順位をつける", "en": "Prioritize your week"}, "desc": {"ja": "月曜日の朝。受信トレイはいっぱいで、Teamsではいくつもの議論が進んでいます。メールを開く前に、まずCopilotに、どこに注意を向けるべきかを尋ねます。", "en": "It is Monday morning. Your inbox is full and several discussions are under way in Teams. Before you open a single email, ask Copilot where your attention is needed."}, "skill": {"ja": "優先順位をつけ、準備し、伝える", "en": "Prioritizing, preparing and communicating"}, "features": {"ja": "ご自身の業務データにもとづく回答、追加の質問による掘り下げ、会議の準備とフォローアップ、二言語での作成", "en": "Answers from your own work data; follow-up questions; meeting preparation and follow-up; writing in two languages"}, "notes": [{"ja": "まず講師のデモをご覧いただき、そのあとご自身のCopilotでお試しください。", "en": "Watch the demonstration first, then try it in your own Copilot."}, {"ja": "[ ] の部分は、ご自身の内容に置き換えてください。", "en": "Replace the text in [ ] with your own details."}, {"ja": "時間が限られる場合は、B1、B2、B4を優先してください。", "en": "If time is short, do B1, B2 and B4 first."}], "prompts": [{"id": "B1", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "今週、私の対応が必要なこと", "en": "What needs my attention this week"}, "text": {"ja": "今週、私の判断や対応が必要なことは何ですか。「要判断」「リスク」「参考情報」に分類して、誰が私の回答を待っているかを示してください。", "en": "What needs my decision or attention this week? Group the items as \"decision needed\", \"risk\" or \"for information\", and show who is waiting for my answer."}, "how": {"ja": "出典のリンクから、元のメールやチャットを開けます。回答が物足りない場合は、「メールと会議も確認してください」と続けてください。", "en": "Use the source links to open the original email or chat. If the answer seems thin, follow up with \"Check my email and meetings too.\""}}, {"id": "B2", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "一段深く掘り下げる", "en": "Go one level deeper"}, "text": {"ja": "最も重要な3件について、背景、最新の状況、進展を妨げている要因、推奨する次の一手を示してください。表形式でまとめてください。", "en": "For the three most important items, show the background, the latest development, what is holding it up, and your recommended next step. Present this as a table."}, "how": {"ja": "B1と同じ会話で続けて実行します。最初からやり直さずに、追加の質問で内容を深められます。", "en": "Run it in the same conversation as B1. Each follow-up adds detail without starting over."}}, {"id": "B3", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "前回の会議を振り返る", "en": "Recap my last leadership meeting"}, "text": {"ja": "前回のリーダーシップ会議の主な決定事項と未完了のアクションを、担当者とあわせてまとめてください。", "en": "Summarize the key decisions and open actions from my last leadership meeting, with an owner for each action."}, "how": {"ja": "会議名を指定すると、より正確な回答になります。", "en": "Name the meeting for a more precise answer."}}, {"id": "B4", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "重要な面談に備える", "en": "Prepare for an important meeting"}, "text": {"ja": "[相手または会議名]との次回の面談に向けて準備をしたいです。これまでの経緯、先方の要望、当社の現在の立場、私が伝えるべき3つのポイントを、1ページにまとめてください。", "en": "Help me prepare for my next meeting with [person or meeting name]. On one page, summarize the background, what they are asking for, our current position, and three points I should make."}, "how": {"ja": "お客様とのトップ面談や、重要な社内会議の準備に適しています。", "en": "Works well for a top-to-top customer meeting or an important internal review."}}, {"id": "B5", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "会議後のフォローアップ", "en": "Follow up after a meeting"}, "text": {"ja": "[相手または会議名]との直近の会議について、フォローアップのメールを下書きしてください。決定事項を確認し、各アクションの担当者と期限を一覧にし、未解決の論点を記載してください。簡潔で丁寧なビジネス文にしてください。", "en": "Draft a follow-up email for my last meeting with [person or meeting name]. Confirm the decisions made, list each action with its owner and due date, and note any open questions. Keep it brief and professional."}, "how": {"ja": "Copilotが作成するのは下書きのみです。内容を確認・修正したうえで、ご自身で送信してください。", "en": "Copilot prepares a draft only. Review and edit it before you send it yourself."}}, {"id": "B6", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "二つの言語で伝える", "en": "Communicate in two languages"}, "text": {"ja": "[テーマ]の現状を、英語で5項目の箇条書きにまとめてください。続けて、同じ内容をリーダーシップチーム向けに、自然なビジネス日本語で作成してください。", "en": "Summarize the current status of [topic] in five bullet points in English. Then write the same summary in natural business Japanese for the leadership team."}, "how": {"ja": "トーンや長さは、続けて指示すれば調整できます。自動で送信されることはありません。", "en": "Ask a follow-up to adjust tone or length. Nothing is sent on your behalf."}}]}, {"id": "plan", "kind": "try", "nav": {"ja": "データから意思決定へ", "en": "From data to decision"}, "navSub": {"ja": "リサーチツール、Excel、PowerPoint", "en": "Researcher, Excel, PowerPoint"}, "title": {"ja": "データから意思決定へ", "en": "From data to decision"}, "desc": {"ja": "数字が出そろいました。売上はほぼ横ばい、数量は減少し、利益は自動販売機や顧客によって大きく異なります。どこに手を打つかを決める前に、リーダーが必要とするのは、外部の視点、データが何を示しているかの把握、選択肢を整理した短い資料の3つです。リーダーは分析を自分で組み立てるのではなく、問いを立てます。", "en": "The numbers are in. Sales are roughly flat, volume is down, and profit varies widely by machine and by customer. Before deciding where to act, a leader needs three things: an outside view, a clear picture of what the data says, and a short paper that frames the choice. You do not build the analysis; you ask the questions."}, "skill": {"ja": "データを問い直し、意思決定を整理する", "en": "Questioning the data and framing the decision"}, "features": {"ja": "リサーチツール、Copilot Chat、Copilot in Excel、Copilot in PowerPoint、ワークスペース", "en": "Researcher, Copilot Chat, Copilot in Excel, Copilot in PowerPoint, Workspaces"}, "notes": [{"ja": "まず各ステップのデモをご覧いただき、そのあと同じ順番でお試しください。", "en": "Watch each step demonstrated first, then try the steps in the same order."}, {"ja": "C3からC10では、サンプルの販売データブックを使用します。下のボタンからダウンロードできます。データはすべて架空です。", "en": "C3 to C10 use the sample sales workbook, which you can download below. All of its data is fictional."}, {"ja": "サンプルの販売データブックでは、NSRの列が純売上高、MPの列が限界利益（製品原価・手数料・決済手数料を差し引いた後の利益）です。売上総利益は、純売上高から製品原価を引いたものです。", "en": "In the sample sales workbook, the NSR column is net sales revenue and the MP column is marginal profit: profit after product cost, location commission and payment fees. Gross profit is net sales revenue minus product cost."}, {"ja": "時間が限られる場合は、C3、C4、C10を優先してください。", "en": "If time is short, do C3, C4 and C10 first."}, {"ja": "C2で挙がる質問は、実行するたびに少しずつ異なります。ご自身の質問を、ご自身の言葉でそのまま販売データブックに問いかけてみてください。", "en": "The questions C2 gives you will differ a little each time. Put any of your own to the sales workbook in your own words."}], "appsEyebrow": {"ja": "はじめる前に", "en": "Before you start"}, "appsTitle": {"ja": "各ステップで使うアプリ", "en": "Where to run each step"}, "appsIntro": {"ja": "ステップごとに、使うアプリやエージェントが変わります。各プロンプトのタイトルの下にも表示しています。", "en": "Each step runs in a different app or agent. The same information appears under each prompt title."}, "apps": [{"t": {"ja": "リサーチツール", "en": "Researcher"}, "q": {"ja": "C1：外部の視点", "en": "C1: the outside view"}, "d": {"ja": "Microsoft 365 Copilot アプリで、エージェントの一覧から「リサーチツール」を選びます。", "en": "In the Microsoft 365 Copilot app, choose Researcher from the list of agents."}, "icon": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABICAYAAAAJZ/BjAAAhcElEQVR42uV9eZBdd3Xm953fvW/pRZI3sDE2BDsBjMcYbDajuC0KJ5WwVCC8rpDChJmwk5qhKKrC1FAj9cz8wWSrZDIYL6RCARMy3UWYMUsSx4XcJphA7GCEEcHGlh0wNjbIklrd/Zb7O2f++C3391qiMjZeE1e1+y1XT++e5Tvf+c65V8QT4T8zLlx/vVvdtaspX9657+4TBM2FRjsfIs+E6s/BcDqIkw2YJ9CDATCMAByC4RCM3wflDvP+DlS4uXGdr//duWceLD93Ye should be. Taking the time to answer gives a more focused report; you can also tell it to proceed with its own assumptions. Research then takes a few minutes and is returned as a report."}, "app": {"ja": "リサーチツール", "en": "Researcher"}}, {"id": "C2", "app": {"ja": "Copilot Chat", "en": "Copilot Chat"}, "title": {"ja": "公開されている報告書を読み解く", "en": "Analyze a published report"}, "text": {"ja": "添付の統合報告書をもとに、単なる要約ではなく、経営の視点でストーリーを説明してください。会社が掲げる優先課題と目標、報告されている進捗、強調されているリスクは何ですか。最後に、これらの優先課題に対する進捗を確かめるために、リーダーが販売データに対して問うべき質問を5つ挙げてください。", "en": "Using the attached integrated report, give me the executive story, not just a summary. What are the company's stated priorities and targets, what progress does it report, and which risks does it highlight? End with five questions a leader should ask of the sales data to check progress against these priorities."}, "how": {"ja": "コカ・コーラ ボトラーズジャパンホールディングスのIRサイトから最新の統合報告書（PDF）をダウンロードし、Copilot Chatに添付します。このステップでは、サンプルデータではなく、実際の公開資料を使います。最後に挙がった5つの質問は控えておいてください。C5とC8では、そのうちの代表的な2つをサンプルデータに問いかけます。", "en": "Download the latest integrated report (PDF) from the Coca-Cola Bottlers Japan Holdings investor site and attach it in Copilot Chat. This step uses a real public document, not sample data. Keep the five questions it ends with: C5 and C8 put two typical ones to the sample data."}, "link": {"url": "https://en.ccbj-holdings.com/ir/library/annual.php", "label": {"ja": "統合報告書のページを開く（英語サイト）", "en": "Open the integrated report page"}}}, {"id": "C3", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "プロンプトでダッシュボードを作る", "en": "Build a dashboard from a prompt"}, "text": {"ja": "Sales、Machines、Customersの各シートを使って、新しいシートにダッシュボードを作成してください。2026年1月～10月の純売上高、売上総利益（純売上高から製品原価を引いたもの）、限界利益を、2025年の同じ月と比較し、部門別とサブチャネル別に示してください。月次の純売上高推移グラフも追加してください。", "en": "Using the Sales, Machines and Customers sheets, build a dashboard on a new sheet. Show net sales revenue, gross profit (net sales revenue minus product cost) and marginal profit for January to October 2026 against the same months of 2025, by department and by subchannel. Add a monthly net sales revenue trend chart."}, "how": {"ja": "サンプルの販売データブックを開いた状態で、Excel内のCopilotで実行します。", "en": "Run it in Copilot in Excel, with the sample sales workbook open."}, "more": [{"ja": "日本語の列の横に、英語の列を追加してください。", "en": "Add English columns alongside the Japanese ones."}, {"ja": "ダッシュボードの計算に使っている非表示のシートを表示してください。内容を確認したいです。", "en": "Show the hidden calculation sheet behind the dashboard so I can review it."}, {"ja": "選択したセルの数式を、わかりやすい言葉で説明してください。", "en": "Explain the formula in the selected cell in plain language."}], "moreNote": {"ja": "3つ目は、ダッシュボードのセルを1つ選択してから実行します。", "en": "For the third one, select a cell on the dashboard first."}}, {"id": "C4", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "不振の自動販売機を見つける", "en": "Identify the underperformers"}, "text": {"ja": "2026年4月以降、限界利益の推移が最も弱い自動販売機を15台挙げてください。それぞれのサブチャネル、顧客名、手数料率、売り切れ日数を示し、「改善」「移設」「撤去」のいずれが適切かを理由とともに提案してください。", "en": "Which 15 machines have the weakest marginal profit trend since April 2026? For each, show the subchannel, customer name, commission rate and sold-out days, and suggest whether to fix, relocate or remove it, with your reasoning."}, "how": {"ja": "C3と同じ会話で続けて実行します。提案はあくまで出発点です。判断はご自身で行ってください。", "en": "Continue in the same conversation as C3. Treat the suggestions as a starting point; the decision is yours."}}, {"id": "C5", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "値上げは需要を損なっていないか", "en": "Are price increases costing us demand?"}, "text": {"ja": "値上げは需要を損なっていませんか。2026年1月～10月の純売上高の前年同期比の増減を、カテゴリー別に、価格による影響と数量による影響に分けて示してください。価格の上昇とともに販売数量が最も大きく減ったカテゴリーを示し、全体の販売数量の増減を、年率0.5～1%という長期の数量成長目標と比較してください。読み取れることを3点にまとめてください。", "en": "Are price increases costing us demand? Split the change in net sales revenue for January to October 2026 against the same months of 2025 into the effect of price and the effect of volume, by category. Show where higher prices came with the largest loss of units, and compare the overall change in units with a long-term volume growth target of 0.5 to 1 percent a year. Summarize what this tells us in three points."}, "how": {"ja": "統合報告書から導かれる問いの一例です。サンプルの販売データブックを開いた状態で、Excel内のCopilotで実行します。", "en": "This is one of the questions the integrated report raises. Run it in Copilot in Excel, with the sample sales workbook open."}}, {"id": "C6", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "供給と需要のずれを見つける", "en": "Find where supply missed demand"}, "text": {"ja": "地域別、月別に、ホット飲料とコールド飲料それぞれで売り切れ日数が最も多かったのはどこですか。Weatherシートの気温と比較し、供給が需要に追いつかなかった地域と月を説明してください。", "en": "By region and month, where were sold-out days highest for hot drinks and for cold drinks? Compare this with the temperatures in the Weather sheet and explain where supply did not keep up with demand."}, "how": {"ja": "サンプルの販売データブックを開いた状態で、Excel内のCopilotで実行します。", "en": "Run it in Copilot in Excel, with the sample sales workbook open."}}, {"id": "C7", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "この冬に備える", "en": "Prepare for the winter ahead"}, "text": {"ja": "Weatherシートの見通し（Outlook）を使って、2026年11月から2027年1月までのホット飲料の販売数量を地域別に予測してください。ホット飲料の品揃えを最初に増やすべき地域を挙げ、予測の前提も示してください。", "en": "Using the outlook rows in the Weather sheet, forecast hot-drink units by region for November 2026 to January 2027. List the regions where hot selections should be increased first, and state the assumptions behind the forecast."}, "how": {"ja": "予測は前提次第で変わります。必ず前提を確認してください。", "en": "A forecast is only as good as its assumptions, so check them."}}, {"id": "C8", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "利益の高い設置先を守る", "en": "Protect the high-profit locations"}, "text": {"ja": "利益の高い設置先は、全体を動かすほどの規模になっていますか。2026年1月～10月について、限界利益の上位20%の自動販売機が限界利益全体に占める割合を示し、1台あたりの限界利益が高い順にサブチャネルを並べてください。次に、今後12か月以内に契約更新を迎える顧客を、この上位グループに自動販売機がある顧客と、限界利益率が平均を下回る顧客に分けて挙げ、各顧客について更新交渉で伝えるべき要点を3つ作成してください。", "en": "Are our high-profit locations large enough to move the business? For January to October 2026, show what share of total marginal profit comes from the top 20 percent of machines, and rank the subchannels by marginal profit per machine. Then list the customers with a contract renewal in the next 12 months, separating those with machines in that top group from those with a marginal profit margin below the average, and draft three talking points for each renewal discussion."}, "how": {"ja": "統合報告書から導かれる問いの一例です。サンプルの販売データブックを開いた状態で、Excel内のCopilotで実行します。", "en": "This is one of the questions the integrated report raises. Run it in Copilot in Excel, with the sample sales workbook open."}}, {"id": "C9", "app": {"ja": "Copilot in Excel", "en": "Copilot in Excel"}, "title": {"ja": "投資の効果を確かめる", "en": "Check that an investment is working"}, "text": {"ja": "AIによる品揃えを開始した自動販売機について、開始前と開始後の売り切れ日数と販売数量を比較してください。導入していない自動販売機とも比較し、効果があったと言えるかを説明してください。", "en": "For machines where AI assortment has started, compare sold-out days and units before and after the start. Compare them with machines that do not have it, and say whether the evidence shows it is working."}, "how": {"ja": "サンプルの販売データブックを開いた状態で、Excel内のCopilotで実行します。", "en": "Run it in Copilot in Excel, with the sample sales workbook open."}}, {"id": "C10", "app": {"ja": "Copilot in PowerPoint", "en": "Copilot in PowerPoint"}, "title": {"ja": "意思決定資料を作成する", "en": "Create the decision paper"}, "text": {"ja": "この販売データブックをもとに、リーダーシップチーム向けの3枚の意思決定サマリーを作成してください。背景ではなく、必要な決定から始めてください。1枚目は、自動販売機事業の利益の前年比とその要因です。2枚目は3つの選択肢（不振機の改善・移設・撤去、利益率の低い契約の見直し、冬に向けたホットとコールドの品揃えの調整）と限界利益への影響、3枚目は推奨案と必要な決定事項です。各スライドの要点を発表者ノートに記載してください。", "en": "Using this sales workbook, create a three-slide decision summary for the leadership team. Lead with the decision required, not the background. Slide 1: where vending profit stands against last year, and why. Slide 2: three options (fix, relocate or remove underperforming machines; renegotiate low-margin contracts; rebalance hot and cold selections ahead of winter) and their impact on marginal profit. Slide 3: the recommendation and the decision required. Add speaker notes with the key message for each slide."}, "how": {"ja": "デモでは、ブランドキットで会社の色とフォントを適用する様子もご覧いただきます。", "en": "The demonstration also shows a brand kit applying company colors and fonts."}}, {"id": "C11", "title": {"ja": "未解決の問いを洗い出す", "en": "Identify the open questions"}, "text": {"ja": "このワークスペースの情報をもとに、判断の前に解決すべき問いは何か、それぞれ誰が担当すべきかを示してください。", "en": "Based on everything in this workspace, which questions remain unanswered before the decision, and who should own each one?"}, "how": {"ja": "質問の前に、関連資料をワークスペースに追加しておきます。", "en": "Add the related material to the workspace before you ask."}, "app": {"ja": "ワークスペース", "en": "Workspaces"}}], "samples": [{"name": "CCBJI Vending Sales - SAMPLE DATA.xlsx", "href": "CCBJI-Vending-Sales-SAMPLE-DATA.xlsx", "eyebrow": {"ja": "サンプルデータ（架空）", "en": "Sample data (fictional)"}, "title": {"ja": "サンプルの販売データブック", "en": "Sample sales workbook"}, "intro": {"ja": "自動販売機300台の月別販売データ（2024年1月～2026年10月）と、自動販売機、顧客、製品、地域別の気温、財務元帳の各シートを収めたExcelブックです。数値はすべて架空であり、CCBJIの実際の顧客、価格、業績を示すものではありません。ファイルは約4MBです。ダウンロード後、OneDriveに保存してからExcelで開いてください。", "en": "An Excel workbook with monthly sales for 300 vending machines (January 2024 to October 2026) and sheets for machines, customers, products, regional weather and a finance ledger. Every figure is fictional and does not represent CCBJI's actual customers, prices or results. The file is about 4 MB. After downloading, save it to OneDrive and open it in Excel."}}]}, {"id": "sharpen", "kind": "optional", "nav": {"ja": "プロンプトを磨く（任意）", "en": "Sharpen your prompts (optional)"}, "navSub": {"ja": "プロンプト コーチ", "en": "Prompt Coach"}, "title": {"ja": "プロンプトを磨く（任意）", "en": "Sharpen your prompts (optional)"}, "desc": {"ja": "どの回答もよくする二つの習慣です。プロンプト コーチと一緒にプロンプトを磨くこと、そしてCopilotの回答をそのまま受け入れず、問い直すことです。", "en": "Two habits that improve every answer: refine your prompt with Prompt Coach, and challenge Copilot's answer rather than accepting it as given."}, "skill": {"ja": "プロンプトを磨き、回答を問い直す", "en": "Refining prompts and challenging answers"}, "features": {"ja": "プロンプト コーチ、前提と根拠の確認", "en": "Prompt Coach; checking assumptions and evidence"}, "notes": [{"ja": "このアクティビティは任意です。時間が限られる場合は省略し、後日ご自身でお試しください。", "en": "This activity is optional. If time is short, skip it and try it later in your own time."}, {"ja": "[ ] の部分は、ご自身の内容に置き換えてください。", "en": "Replace the text in [ ] with your own details."}], "prompts": [{"id": "D1", "title": {"ja": "プロンプトを改善する", "en": "Improve my prompt"}, "text": {"ja": "次のプロンプトを改善してください：「[自動販売機事業の状況を教えてください]」。よりよい回答を得るための質問を、3つまで私にしてください。そのうえで、目的、背景、情報源、期待する形式を明確にして書き直してください。", "en": "Help me improve this prompt: \"[Give me an update on our vending business]\". Ask me up to three questions that would lead to a better answer. Then rewrite the prompt with a clear goal, context, source and expectations."}, "how": {"ja": "[ ] の例は、ご自身のプロンプトに置き換えられます。質問に答えたあと、書き直されたプロンプトをCopilot Chatで実行し、元のプロンプトの結果と比べてみてください。", "en": "You can replace the example in [ ] with a prompt of your own. Answer the questions, then run the rewritten prompt in Copilot Chat and compare it with the result of the original."}, "app": {"ja": "プロンプト コーチ", "en": "Prompt Coach"}}, {"id": "D2", "title": {"ja": "回答を問い直す", "en": "Challenge the answer"}, "text": {"ja": "今の回答で、どのような前提を置きましたか。根拠が最も弱いのはどの部分で、どのような情報があれば結論が変わりますか。", "en": "What assumptions did you make in that answer? Which part has the weakest support, and what information would change your conclusion?"}, "how": {"ja": "Copilotの回答は、そのまま受け入れず、問い直すことが大切です。重要な判断に使う前に、どのCopilotのどの回答にも使えます。", "en": "Do not accept an answer as given: challenge it. This works on any answer, in any Copilot, before you rely on it for an important decision."}, "app": {"ja": "Copilot Chat（どのCopilotでも可）", "en": "Copilot Chat (or any Copilot)"}}], "appsEyebrow": {"ja": "はじめる前に", "en": "     var pg=el('div','pager');
    var pv=el('button','pg','← '+t(UI.prev));pv.type='button';if(i===0)pv.disabled=true;pv.addEventListener('click',function(){go(i-1)});
    var nx=el('button','pg nextb',(i===0?t(UI.begin):t(UI.next))+' →');nx.type='button';if(i===N)nx.disabled=true;nx.addEventListener('click',function(){go(i+1)});
    pg.appendChild(pv);pg.appendChild(nx);s.appendChild(pg);
    return s;
  }
  function render(){
    document.documentElement.lang=lang;document.documentElement.setAttribute('data-theme',theme);
    document.title=t(EX[cur].nav)+' | CCBJI '+t(M.brand);
    $('eyebrow').textContent=t(M.eyebrow);$('brand').textContent=t(M.brand);$('choose').textContent=t(UI.choose);
    $('countAll').textContent=t(UI.countAll).replace('{n}',N);
    $('guide').textContent=t(M.guide);$('guideSub').textContent=t(M.guideSub);
    $('btnLang').textContent=t(UI.lang);$('btnTheme').textContent=t(UI.theme);$('btnPrint').textContent=t(UI.print);
    $('progText').textContent=cur===0?t(UI.kinds.start):t(UI.of).replace('{i}',cur).replace('{n}',N);
    $('fill').style.inlineSize=(cur/N*100)+'%';
    var tr=$('track');tr.setAttribute('aria-valuemax',N);tr.setAttribute('aria-valuenow',cur);
    $('fFict').textContent=t(UI.fictional);$('fNote').textContent=t(UI.footer);
    $('fVer').textContent=t(UI.version)+' '+M.version+' · '+t(M.date);
    renderNav();
    var st=$('stage');st.textContent='';EX.forEach(function(e,i){st.appendChild(section(e,i))});
  }
  $('btnLang').addEventListener('click',function(){lang=lang==='ja'?'en':'ja';set('lang',lang);render()});
  $('btnTheme').addEventListener('click',function(){theme=theme==='dark'?'light':'dark';set('theme',theme);render()});
  $('btnPrint').addEventListener('click',function(){window.print()});
  document.addEventListener('keydown',function(ev){if(ev.altKey&&ev.key==='ArrowRight')go(cur+1);if(ev.altKey&&ev.key==='ArrowLeft')go(cur-1)});
  render();
})();
</script>
</body>
</html>
